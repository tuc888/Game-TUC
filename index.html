  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #000; color: #fff; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; user-select: none; }
    .iphone-frame { width: 390px; height: 810px; background: #1c1c1e; border-radius: 50px; border: 12px solid #3a3a3c; box-shadow: 0 20px 50px rgba(0,0,0,0.8); display: flex; flex-direction: column; overflow: hidden; position: relative; }
    .ios-status-bar { height: 44px; display: flex; justify-content: space-between; align-items: center; padding: 0 24px; font-size: 14px; font-weight: 600; color: #fff; background: transparent; z-index: 100; flex-shrink: 0; }
    .dynamic-island { width: 120px; height: 28px; background: #000; border-radius: 14px; position: absolute; left: 50%; transform: translateX(-50%); top: 8px; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #00ffcc; font-weight: bold; }
    .iphone-screen { flex: 1; background: linear-gradient(135deg, #1c2a38, #0f0f11); display: flex; flex-direction: column; overflow: hidden; position: relative; }

    .app-icon-container { display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; position: relative; }
    .app-icon { width: 60px; height: 60px; border-radius: 14px; display: flex; justify-content: center; align-items: center; font-size: 26px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); transition: transform 0.1s; }
    .app-icon:active { transform: scale(0.92); }
    .app-label { font-size: 11px; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.8); }
    .badge { position: absolute; top: -2px; right: 8px; background: #ff3b30; color: white; border-radius: 10px; font-size: 10px; padding: 2px 6px; font-weight: bold; display: none; }
    
    /* Line 風格通知與彈窗 */
    .ios-notification { position: absolute; top: 50px; left: 12px; right: 12px; background: rgba(30,30,30,0.95); backdrop-filter: blur(20px); border-radius: 16px; padding: 12px 14px; box-shadow: 0 10px 25px rgba(0,0,0,0.6); border: 1px solid rgba(0,255,100,0.3); z-index: 200; animation: slideDown 0.4s ease-out; cursor: pointer; }
    @keyframes slideDown { from { transform: translateY(-70px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    /* 多巴胺支付成功彈窗 */
    .success-popup { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); background: rgba(20,20,20,0.95); border: 2px solid #34c759; border-radius: 20px; padding: 24px; text-align: center; z-index: 500; box-shadow: 0 15px 35px rgba(0,0,0,0.8); animation: popIn 0.3s ease-out; }
    @keyframes popIn { 0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; } 100% { transform: translate(-50%, -50%) scale(1); opacity: 1; } }

    /* 臉部審核彈窗 */
    .face-verify-modal { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 400; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; text-align: center; }

    .app-view { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #121212; z-index: 50; display: flex; flex-direction: column; animation: slideUp 0.3s ease-out; }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .app-nav-bar { height: 50px; background: #1c1c1e; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid #333; flex-shrink: 0; }
    .app-body { flex: 1; overflow-y: auto; padding: 16px; }
    
    .ios-btn { width: 100%; padding: 12px; background: #007aff; color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; margin: 8px 0; text-align: center; }
    .ios-btn:active { opacity: 0.8; }
    .ios-btn.danger { background: #ff3b30; }
    .ios-btn.success { background: #34c759; }

    /* 拉霸動畫與外觀 */

    /* 聊天室與語音 */

<script>
  // 音效系統 (Web Audio API 模擬 Line 通知與多巴胺音效)
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  let audioCtxInstance = null;
  function playSound(type) {
    try {
      if (!audioCtxInstance) audioCtxInstance = new AudioCtx();
      if (audioCtxInstance.state === 'suspended') audioCtxInstance.resume();
      const osc = audioCtxInstance.createOscillator();
      const gain = audioCtxInstance.createGain();
      osc.connect(gain);
      gain.connect(audioCtxInstance.destination);

      if (type === 'line') {
        // Line 經典雙響通知音效
        osc.frequency.setValueAtTime(1046.5, audioCtxInstance.currentTime); // C6
        osc.frequency.setValueAtTime(1318.5, audioCtxInstance.currentTime + 0.1); // E6
        gain.gain.setValueAtTime(0.2, audioCtxInstance.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtxInstance.currentTime + 0.25);
        osc.start(); osc.stop(audioCtxInstance.currentTime + 0.25);
      } else if (type === 'spin') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, audioCtxInstance.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtxInstance.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtxInstance.currentTime + 0.1);
        osc.start(); osc.stop(audioCtxInstance.currentTime + 0.1);
      } else if (type === 'win') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(523.25, audioCtxInstance.currentTime);
        osc.frequency.setValueAtTime(659.25, audioCtxInstance.currentTime + 0.1);
        osc.frequency.setValueAtTime(783.99, audioCtxInstance.currentTime + 0.2);
        gain.gain.setValueAtTime(0.3, audioCtxInstance.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtxInstance.currentTime + 0.5);
        osc.start(); osc.stop(audioCtxInstance.currentTime + 0.5);
      } else if (type === 'success-pay') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, audioCtxInstance.currentTime);
        osc.frequency.setValueAtTime(659.25, audioCtxInstance.currentTime + 0.08);
        osc.frequency.setValueAtTime(783.99, audioCtxInstance.currentTime + 0.16);
        osc.frequency.setValueAtTime(1046.50, audioCtxInstance.currentTime + 0.24);
        gain.gain.setValueAtTime(0.3, audioCtxInstance.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtxInstance.currentTime + 0.6);
        osc.start(); osc.stop(audioCtxInstance.currentTime + 0.6);
      } else if (type === 'lose') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(200, audioCtxInstance.currentTime);
        osc.frequency.setValueAtTime(100, audioCtxInstance.currentTime + 0.15);
        gain.gain.setValueAtTime(0.3, audioCtxInstance.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtxInstance.currentTime + 0.4);
        osc.start(); osc.stop(audioCtxInstance.currentTime + 0.4);
      } else if (type === 'error') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(130, audioCtxInstance.currentTime);
        osc.frequency.setValueAtTime(90, audioCtxInstance.currentTime + 0.15);
        gain.gain.setValueAtTime(0.3, audioCtxInstance.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtxInstance.currentTime + 0.35);
        osc.start(); osc.stop(audioCtxInstance.currentTime + 0.35);
      }
    } catch(e) {
      console.log("Audio skipped", e);
    }
  }

    playSound('line');

      let utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'zh-TW';
      utterance.rate = 1.0;

  // 轉盤邏輯與動態勝率計算
  function playSlotAnimation(amount) {
    if (state.day <= 5 && amount > 5000) {
      alert("【防沉迷限制】前 5 天平台規範：單筆投注金額不得超過 NT$ 5,000！");
      return;
    }
    if (amount <= 0 || state.cash < amount) {
      alert("現金不足！");
      return;
    }

    let r1 = document.getElementById("reel-1");
    let r2 = document.getElementById("reel-2");
    let r3 = document.getElementById("reel-3");
    let resEl = document.getElementById("gamble-res");
    if (!r1 || !r2 || !r3 || !resEl) return;

    r1.className = "slot-reel-inner spinning";
    r2.className = "slot-reel-inner spinning";
    r3.className = "slot-reel-inner spinning";
    resEl.innerText = "旋轉中...";
    playSound('spin');

    setTimeout(() => {
      let isWin = false;
      let totalSpinsGlobal = (state.day - 1) * 10 + state.spinsToday + 1;

      // 前三次轉盤保證獲勝
      if (totalSpinsGlobal <= 3) {
        isWin = true;
      } else {
        // 後面大約維持 60% 勝率、40% 輸，越後面輸的機率越高
        let winProbability = Math.max(0.15, 0.60 - (state.day * 0.015));
        isWin = Math.random() < winProbability;
      }

      r1.className = "slot-reel-inner";
      r2.className = "slot-reel-inner";
      r3.className = "slot-reel-inner";

      if (isWin) {
        r1.innerText = "7️⃣"; r2.innerText = "7️⃣"; r3.innerText = "7️⃣";
        let win = Math.floor(amount * 1.5);
        state.cash += win;
        resEl.style.color = "#34c759";
        resEl.innerText = `🎉 中大獎！贏得 NT$ ${win.toLocaleString()}`;
        playSound('win');
      } else {
        r1.innerText = "🍒"; r2.innerText = "💎"; r3.innerText = "7️⃣";
        state.cash -= amount;
        resEl.style.color = "#ff3b30";
        resEl.innerText = `😢 未中獎，損失 NT$ ${amount.toLocaleString()}`;
        playSound('lose');
        let frame = document.getElementById("phone-frame");
        if (frame) {
          frame.classList.add("shake");
          setTimeout(() => frame.classList.remove("shake"), 400);
        }
      }

      state.spinsToday++;
      
      let liveCashEl = document.getElementById("casino-live-cash");
      if (liveCashEl) liveCashEl.innerText = `NT$ ${state.cash.toLocaleString()}`;
      
      updateUI();

      // 當現金低於 1,0000 且安裝了娛樂城後，阿偉傳訊息推薦網貸平台
      if (state.cash < 10000 && !state.loanInstalled && state.casinoInstalled) {
        setTimeout(() => {
          state.contacts.friend.unread++;
          state.contacts.friend.messages.push({
            sender: "friend",
            text: "兄弟，看你現金快見底了？別擔心！我都在這個『借貸錢莊 App』拿週轉金，三秒撥款，快載來借錢翻盤！",
            voice: "兄弟，看你現金快見底了？我都在這個借貸錢莊拿週轉金，快載來借錢翻盤！",
            isLoanLink: true
          });
          triggerNotification("好友阿偉", "兄弟，看你現金快見底了？我都在這個『借貸錢莊』...", "friend");
          updateUI();
        }, 600);
      }

    }, 1200);
  }

  function startCameraSnap(name, amount, rate) {
    let textEl = document.getElementById("verify-text");
    let btnEl = document.getElementById("snap-btn");
    btnEl.style.display = "none";

    let count = 3;
    textEl.style.fontSize = "24px";
    textEl.style.color = "#00ffcc";
    textEl.innerText = count;

    let timer = setInterval(() => {
      count--;
      if (count > 0) {
        textEl.innerText = count;
      } else {
        clearInterval(timer);
        textEl.innerText = "✅ 核准完成！";
        playSound('win');

        setTimeout(() => {
          let modal = document.querySelector(".face-verify-modal");
          if (modal) modal.remove();

          alert(`✅ 審核通過！銀行已成功到帳 NT$ ${amount.toLocaleString()} 至您的「未來支付」。`);
          state.loans.push({ name: name, amount: amount, rate: rate });
          state.cash += amount;

          // 借網貸後開始推送網貸平台廣告
          state.contacts.loanAd1 = { name: "速速發小額貸款", avatar: "💸", unread: 1, messages: [{ sender: "loanAd1", text: "【秒撥款通知】恭喜您獲得 50,000 元信用額度，免保人、免照會，點擊立即撥款！", voice: "恭喜您獲得五萬元信用額度，點擊立即撥款！" }] };
          triggerNotification("速速發小額貸款", "恭喜您獲得 50,000 元信用額度，點擊立即撥款！", "loanAd1");

          closeApp();
          updateUI();
        }, 1000);
      }
    }, 1000);
  }

      setTimeout(() => overlay.remove(), 1800);
    }

    state.day++;
    state.spinsToday = 0;

    let totalLoanAmount = 0;
    state.loans.forEach(l => {
      l.amount = Math.floor(l.amount * (1 + l.rate));
      totalLoanAmount += l.amount;
    });

    if (state.loans.length > 0) {
      setTimeout(() => {
        state.contacts.loanSys = { name: "地下融資催收處", avatar: "⚠️", unread: 1, messages: [{ sender: "loanSys", text: `【利息帳單】您目前高利貸總欠款因 50% 利息滾動已達 NT$ ${totalLoanAmount.toLocaleString()}，請盡速還款！`, voice: `高利貸總欠款已達新台幣 ${totalLoanAmount.toLocaleString()} 元，請盡速還款！` }] };
        triggerNotification("地下融資催收處", `高利貸總欠款已達 NT$ ${totalLoanAmount.toLocaleString()}！`, "loanSys");
        updateUI();
      }, 1000);
    }

    if (dailyConfig[state.day]) {
      state.currentBill = { name: dailyConfig[state.day].bill.name, amount: dailyConfig[state.day].bill.amount, paid: false };
      
      if (dailyConfig[state.day].wife) {
        state.contacts.wife.unread++;
        state.contacts.wife.messages.push({ sender: "wife", text: dailyConfig[state.day].wife, voice: dailyConfig[state.day].wife });
        triggerNotification("老婆", dailyConfig[state.day].wife, "wife");
      }
      if (dailyConfig[state.day].child) {
        state.contacts.child.unread++;
        state.contacts.child.messages.push({ sender: "child", text: dailyConfig[state.day].child, voice: dailyConfig[state.day].child });
        triggerNotification("小孩", dailyConfig[state.day].child, "child");
      }
    } else {
      state.currentBill = { name: "日常生活雜費與利息分期", amount: 7000, paid: false };
    }

    if (state.day === 2) {
      state.contacts.friend.unread++;
      state.contacts.friend.messages.push({
        sender: "friend",
        text: "欸兄弟！我最近在『橘哥娛樂城』爽賺翻了！連結發你，趕快上車！",
        voice: "欸兄弟！我最近在橘哥娛樂城爽賺翻了！連結發你，趕快上車！",
        isCasinoLink: true
      });
      triggerNotification("好友阿偉", "欸兄弟！我最近在『橘哥娛樂城』爽賺翻了！...", "friend");
    }

    if (state.day === 20) {
      state.contacts.collector = { name: "討債專員-虎哥", avatar: "🕶️", unread: 1, messages: [{ sender: "collector", text: "林先生，聽說你躲得很開心？我們已經知道你家地址跟小孩學校在哪了，明天中午前沒看到錢，自己小心點。", voice: "林先生，我們已經知道你家地址跟小孩學校在哪了，明天中午前沒看到錢自己小心點。" }] };
      triggerNotification("討債專員-虎哥", "我們已經知道你家地址跟小孩學校在哪了...", "collector");
    }

    if (state.day === 29) {
      state.contacts.collector = { name: "討債專員-虎哥", avatar: "🕶️", unread: 1, messages: [{ sender: "collector", text: "碰！大門被砸的聲音。小子，限你三小時內生出 50 萬，不然今天砍你一隻手！", voice: "小子，限你三小時內生出五十萬，不然今天砍你一隻手！" }] };
      triggerNotification("討債專員-虎哥", "限你三小時內生出 50 萬，不然今天砍你一隻手！", "collector");
    }

    if (state.day > state.maxDays) {
      alert("【悲劇結局：家破人亡】\n\n因沉迷線上博弈與地下高利貸, 你不但輸光了積蓄、氣死至親, 妻子也帶著孩子絕望離去。面對排山倒海的債務與黑衣人的暴力逼債, 你在冰冷的房間中留下一封遺書, 結束了一生。\n\n警語：回頭是岸, 遠離賭博, 珍惜摯愛。");
      location.reload();
      return;
    }

    updateUI();
  }

  updateUI();
</script>
