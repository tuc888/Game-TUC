      const osc = audioCtxInstance.createOscillator();
      const gain = audioCtxInstance.createGain();
      osc.connect(gain);
      gain.connect(audioCtxInstance.destination);

      if (type === 'click') {
        osc.frequency.setValueAtTime(800, audioCtxInstance.currentTime);
        gain.gain.setValueAtTime(0.05, audioCtxInstance.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtxInstance.currentTime + 0.05);
        osc.start(); osc.stop(audioCtxInstance.currentTime + 0.05);
      } else if (type === 'tick') {
        osc.frequency.setValueAtTime(600, audioCtxInstance.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtxInstance.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtxInstance.currentTime + 0.08);
        osc.start(); osc.stop(audioCtxInstance.currentTime + 0.08);
      } else if (type === 'shutter') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(300, audioCtxInstance.currentTime);
        osc.frequency.setValueAtTime(150, audioCtxInstance.currentTime + 0.1);
        gain.gain.setValueAtTime(0.2, audioCtxInstance.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtxInstance.currentTime + 0.2);
        osc.start(); osc.stop(audioCtxInstance.currentTime + 0.2);
      } else if (type === 'line') {
        osc.frequency.setValueAtTime(1046.5, audioCtxInstance.currentTime); 
        osc.frequency.setValueAtTime(1318.5, audioCtxInstance.currentTime + 0.1); 
        gain.gain.setValueAtTime(0.2, audioCtxInstance.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtxInstance.currentTime + 0.25);
        osc.start(); osc.stop(audioCtxInstance.currentTime + 0.25);
      } else if (type === 'spin') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, audioCtxInstance.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtxInstance.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtxInstance.currentTime + 0.1);
        osc.start(); osc.stop(audioCtxInstance.currentTime + 0.1);
      } else if (type === 'win') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(523.25, audioCtxInstance.currentTime);
        osc.frequency.setValueAtTime(659.25, audioCtxInstance.currentTime + 0.1);
        osc.frequency.setValueAtTime(783.99, audioCtxInstance.currentTime + 0.2);
        gain.gain.setValueAtTime(0.3, audioCtxInstance.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtxInstance.currentTime + 0.5);
        osc.start(); osc.stop(audioCtxInstance.currentTime + 0.5);
      } else if (type === 'success-pay') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, audioCtxInstance.currentTime);
        osc.frequency.setValueAtTime(659.25, audioCtxInstance.currentTime + 0.08);
        osc.frequency.setValueAtTime(783.99, audioCtxInstance.currentTime + 0.16);
        osc.frequency.setValueAtTime(1046.50, audioCtxInstance.currentTime + 0.24);
        gain.gain.setValueAtTime(0.3, audioCtxInstance.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtxInstance.currentTime + 0.6);
        osc.start(); osc.stop(audioCtxInstance.currentTime + 0.6);
      } else if (type === 'lose' || type === 'error-pay') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(180, audioCtxInstance.currentTime);
        osc.frequency.setValueAtTime(90, audioCtxInstance.currentTime + 0.15);
        gain.gain.setValueAtTime(0.3, audioCtxInstance.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtxInstance.currentTime + 0.4);
        osc.start(); osc.stop(audioCtxInstance.currentTime + 0.4);
      }
    } catch(e) {}
  }

    let c = state.contacts[contactKey];
    c.unread = 0;
    updateUI();

    let screen = document.getElementById("phone-screen");
    let view = document.createElement("div");
    view.className = "app-view";

    let navBar = document.createElement("div");
    navBar.className = "app-nav-bar";
    navBar.innerHTML = '<span style="font-weight:600;">' + c.avatar + ' ' + c.name + '</span>' +
                       '<span style="color:#00b900; cursor:pointer;" onclick="playSound(\'click\'); this.closest(\'.app-view\').remove()">返回</span>';
    view.appendChild(navBar);

    let body = document.createElement("div");
    body.className = "app-body";
    body.style.cssText = "display:flex; flex-direction:column; gap:8px;";

    c.messages.forEach(m => {
      let b = document.createElement("div");
      b.className = "chat-bubble " + (m.sender === 'user' ? 'outgoing' : 'incoming');
      
      if (m.isCasinoLink) {
        b.className += " link-box";
        b.innerHTML = '<div style="font-size:32px; margin-bottom:4px;">🎰</div>' +
                      '<div style="font-weight:bold; color:#00ffcc;">【橘哥娛樂城 App 安裝檔】</div>' +
                      '<div style="font-size:11px; color:#aaa; margin-top:2px;">點擊此安裝檔圖片以安裝應用程式</div>';
        b.onclick = () => { playSound('click'); promptInstallCasino(); };
      } else if (m.isLoanLink) {
        b.className += " link-box";
        b.innerHTML = '<div style="font-size:32px; margin-bottom:4px;">💰</div>' +
                      '<div style="font-weight:bold; color:#ff9500;">【借貸錢莊 App 安裝檔】</div>' +
                      '<div style="font-size:11px; color:#aaa; margin-top:2px;">點擊此安裝檔圖片以解鎖網貸</div>';
        b.onclick = () => { playSound('click'); promptInstallLoan(); };
      } else {
        b.innerHTML = '<div>' + m.text + '</div>';
        let voiceBtn = document.createElement("div");
        voiceBtn.className = "voice-msg-btn";
        voiceBtn.innerText = "▶ 播放語音";
        voiceBtn.onclick = () => playVoice(m.text);
        b.appendChild(voiceBtn);
      }

      body.appendChild(b);
    });

    view.appendChild(body);
    screen.appendChild(view);
  }

  function promptInstallCasino() {
    if (state.casinoInstalled) {
      alert("📲 「橘哥娛樂城 App」已經安裝過了！");
      return;
    }
    let confirmInstall = confirm("📥 是否要安裝「橘哥娛樂城 App」？");
    if (confirmInstall) {
      installCasino();
    }
  }

  function promptInstallLoan() {
    if (state.loanInstalled) {
      alert("📲 「借貸錢莊 App」已經安裝過了！");
      return;
    }
    let confirmInstall = confirm("📥 是否要安裝「借貸錢莊 App」？");
    if (confirmInstall) {
      installLoan();
    }
  }

  function payBill() {
    let screen = document.getElementById("phone-screen");
    if (state.cash < state.currentBill.amount) {
      playSound('error-pay');
      let errPopup = document.createElement("div");
      errPopup.className = "error-popup";
      errPopup.innerHTML = '<div style="font-size:36px; margin-bottom:8px;">❌</div>' +
                           '<div style="font-size:16px; font-weight:bold; color:#ff3b30; margin-bottom:4px;">餘額不足！</div>' +
                           '<div style="font-size:12px; color:#ddd;">帳戶現金不足以支付 ' + state.currentBill.name + '</div>';
      screen.appendChild(errPopup);
      setTimeout(() => errPopup.remove(), 1800);
      return;
    }
    state.cash -= state.currentBill.amount;
    state.currentBill.paid = true;
    playSound('success-pay');

    let popup = document.createElement("div");
    popup.className = "success-popup";
    popup.innerHTML = '<div style="font-size:36px; margin-bottom:8px;">🎉</div>' +
                      '<div style="font-size:16px; font-weight:bold; color:#34c759; margin-bottom:4px;">支付成功！</div>' +
                      '<div style="font-size:12px; color:#ddd;">已完成 ' + state.currentBill.name + '</div>';
    screen.appendChild(popup);
    setTimeout(() => popup.remove(), 1600);

    closeApp();
    openApp('futurePay');
    updateUI();
  }

  function repayLoan(idx) {
    let l = state.loans[idx];
    let screen = document.getElementById("phone-screen");
    if (state.cash < l.amount) {
      playSound('error-pay');
      let errPopup = document.createElement("div");
      errPopup.className = "error-popup";
      errPopup.innerHTML = '<div style="font-size:36px; margin-bottom:8px;">❌</div>' +
                           '<div style="font-size:16px; font-weight:bold; color:#ff3b30; margin-bottom:4px;">餘額不足！</div>' +
                           '<div style="font-size:12px; color:#ddd;">現金不足以償還 ' + l.name + '</div>';
      screen.appendChild(errPopup);
      setTimeout(() => errPopup.remove(), 1800);
      return;
    }
    state.cash -= l.amount;
    state.loans.splice(idx, 1);
    state.loanWarningCount = 0;
    playSound('success-pay');

    let popup = document.createElement("div");
    popup.className = "success-popup";
    popup.innerHTML = '<div style="font-size:36px; margin-bottom:8px;">🎉</div>' +
                      '<div style="font-size:16px; font-weight:bold; color:#34c759; margin-bottom:4px;">還款成功！</div>' +
                      '<div style="font-size:12px; color:#ddd;">已清償 ' + l.name + '</div>';
    screen.appendChild(popup);
    setTimeout(() => popup.remove(), 1600);

    closeApp();
    openApp('futurePay');
    updateUI();
  }

  function installCasino() {
    if (state.casinoInstalled) return;
    alert("📲 「橘哥娛樂城 App」安裝完成！已新增至桌面。");
    state.casinoInstalled = true;
    document.getElementById("casino-app-icon").style.display = "flex";
    closeApp();
    updateUI();
  }

  function installLoan() {
    if (state.loanInstalled) return;
    state.loanVisitCount++;
    alert("📲 「借貸錢莊 App」安裝完成！已新增至桌面。");
    state.loanInstalled = true;
    document.getElementById("loan-app-icon").style.display = "flex";
    closeApp();
    updateUI();
  }

  function playSlotAnimation(amount) {
    if (state.cash < amount) {
      alert("現金不足！");
      return;
    }

    let r1 = document.getElementById("reel-1");
    let r2 = document.getElementById("reel-2");
    let r3 = document.getElementById("reel-3");
    let resEl = document.getElementById("gamble-res");
    if (!r1 || !r2 || !r3 || !resEl) return;

    r1.className = "slot-reel-inner spinning";
    r2.className = "slot-reel-inner spinning";
    r3.className = "slot-reel-inner spinning";
    resEl.innerText = "旋轉中...";
    playSound('spin');

    setTimeout(() => {
      let winProb = 0.60;
      if (amount === 5000) winProb = 0.60;
      else if (amount === 10000) winProb = 0.30;
      else if (amount === 50000 || amount === state.cash) winProb = 0.10;
      else if (state.day >= 10) winProb = 0.15;

      let isWin = Math.random() < winProb;

      r1.className = "slot-reel-inner";
      r2.className = "slot-reel-inner";
      r3.className = "slot-reel-inner";

      if (isWin) {
        r1.innerText = "7️⃣"; r2.innerText = "7️⃣"; r3.innerText = "7️⃣";
        let win = Math.floor(amount * 1.5);
        state.cash += win;
        resEl.style.color = "#34c759";
        resEl.innerText = "🎉 中大獎！贏得 NT$ " + win.toLocaleString();
        playSound('win');
      } else {
        r1.innerText = "🍒"; r2.innerText = "💎"; r3.innerText = "7️⃣";
        state.cash -= amount;
        resEl.style.color = "#ff3b30";
        resEl.innerText = "😢 未中獎，損失 NT$ " + amount.toLocaleString();
        playSound('lose');
        let frame = document.getElementById("phone-frame");
        if (frame) {
          frame.classList.add("shake");
          setTimeout(() => frame.classList.remove("shake"), 400);
        }
      }

      state.spinsToday++;
      let liveCash = document.getElementById("casino-live-cash");
      if (liveCash) liveCash.innerText = "NT$ " + state.cash.toLocaleString();
      updateUI();

      if (state.cash < 10000 && !state.loanInstalled && state.casinoInstalled) {
        setTimeout(() => {
          state.contacts.friend.unread++;
          state.contacts.friend.messages.push({
            sender: "friend",
            text: "兄弟，看你現金快見底了？快點擊下方安裝檔安裝『借貸錢莊 App』借錢翻盤！",
            isLoanLink: true
          });
          triggerNotification("好友阿偉", "點擊下方安裝檔安裝『借貸錢莊 App』...", "friend");
          updateUI();
        }, 500);
      }
    }, 1200);
  }

  function requestLoan(name, amount, rate) {
    if (state.borrowedPlatforms.includes(name)) return;
    let screen = document.getElementById("phone-screen");
    if (!screen) return;

    let modal = document.createElement("div");
    modal.className = "face-verify-modal";
    modal.innerHTML = '<div style="font-size:36px; margin-bottom:10px;">📸</div>' +
                      '<h3 style="color:#fff; margin-bottom:6px;">面容身份審核</h3>' +
                      '<p id="verify-text" style="font-size:13px; color:#ff9500; margin-bottom:20px;">請確認眼鏡是否有摘除，以進行人臉識別解鎖</p>' +
                      '<button class="ios-btn success" id="snap-btn" onclick="playSound(\'click\'); startCameraSnap(\'' + name + '\', ' + amount + ', ' + rate + ')">點擊拍照按鈕</button>';
    screen.appendChild(modal);
  }

  function startCameraSnap(name, amount, rate) {
    let textEl = document.getElementById("verify-text");
    let btnEl = document.getElementById("snap-btn");
    if (btnEl) btnEl.style.display = "none";

    let count = 3;
    textEl.style.fontSize = "28px";
    textEl.style.color = "#00ffcc";
    textEl.innerText = count;
    playSound('tick');

    let timer = setInterval(() => {
      count--;
      if (count > 0) {
        textEl.innerText = count;
        playSound('tick');
      } else {
        clearInterval(timer);
        playSound('shutter');
        textEl.innerText = "✅ 核准完成！";

        setTimeout(() => {
          let modal = document.querySelector(".face-verify-modal");
          if (modal) modal.remove();

          let totalRepay = Math.floor(amount * (1 + rate));
          let dueDay = state.day + 2;
          alert("✅ 審核通過！「" + name + "」已撥款 NT$ " + amount.toLocaleString() + "。\n💡 提醒：今日申貸當日免還，本利和共 NT$ " + totalRepay.toLocaleString() + " 將於【第 " + dueDay + " 天（過兩天）】到期需在未來支付還款！");
          
          state.everBorrowedLoan = true;
          state.loans.push({ name: name, amount: totalRepay, dueDay: dueDay });
          state.borrowedPlatforms.push(name);
          state.cash += amount;

          let colKey = "col_" + Date.now();
          state.contacts[colKey] = {
            name: name + " 催收",
            avatar: "⚠️",
            unread: 1,
            messages: [{ sender: colKey, text: "本利和 NT$ " + totalRepay.toLocaleString() + "，於第 " + dueDay + " 天到期必須清償！" }]
          };
          triggerNotification(name + " 催收", "本利和 NT$ " + totalRepay.toLocaleString() + " 須於第 " + dueDay + " 天清償！", colKey);
          closeApp();
          updateUI();
        }, 1000);
      }
    }, 1000);
  }

  function showBadEnding(totalDebt) {
    playSound('lose');
    let phoneFrame = document.getElementById("phone-frame");
    let endDiv = document.createElement("div");
    endDiv.className = "ending-overlay";
    endDiv.innerHTML = '<div style="font-size:48px; margin-bottom:12px;">💔</div>' +
                       '<h2 style="color:#ff3b30; font-size:22px; margin-bottom:10px;">【悲劇結局：家破人亡】</h2>' +
                       '<p style="font-size:13px; color:#ff9500; margin-bottom:12px; line-height:1.5;">最終累積未清償債務：<br><b style="font-size:20px; color:#ff3b30;">NT$ ' + totalDebt.toLocaleString() + '</b></p>' +
                       '<p style="font-size:12px; color:#ccc; line-height:1.6; margin-bottom:20px;">高利貸利滾利如雪球般龐大...討債黑衣人找上門撒冥紙恐嚇，小孩被黑道帶走，老婆心碎離家出走。男主在絕望與無窮無盡的債務黑洞中，最終選擇跳樓自殺，結束了年輕的生命...</p>' +
                       '<div style="background:rgba(255,59,48,0.2); border:1px solid #ff3b30; padding:12px; border-radius:12px; font-size:13px; font-weight:bold; color:#fff; line-height:1.5;">' +
                       '⚠️ 遠離賭博，珍惜生命<br>請勿觸碰高利貸！' +
                       '</div>' +
                       '<button class="ios-btn danger" style="margin-top:20px;" onclick="location.reload()">重新開始遊戲</button>';
    phoneFrame.appendChild(endDiv);
  }

  function showGoodEnding() {
    playSound('win');
    let phoneFrame = document.getElementById("phone-frame");
    let endDiv = document.createElement("div");
    endDiv.className = "ending-overlay";
    endDiv.innerHTML = '<div style="font-size:48px; margin-bottom:12px;">🎉</div>' +
                       '<h2 style="color:#34c759; font-size:22px; margin-bottom:10px;">【完美結局：安穩歲月】</h2>' +
                       '<p style="font-size:13px; color:#00ffcc; margin-bottom:16px; line-height:1.5;">恭喜你順利度過了 15 天！<br>你成功抵擋了地下博弈與高利貸的誘惑，完全沒有欠下任何非法高利貸！</p>' +
                       '<p style="font-size:12px; color:#ccc; line-height:1.6; margin-bottom:20px;">家庭幸福和睦，老婆與孩子都在身邊陪伴著你。踏實生活，才是人生最大的財富。</p>' +
                       '<div style="background:rgba(52,199,89,0.2); border:1px solid #34c759; padding:12px; border-radius:12px; font-size:13px; font-weight:bold; color:#fff; line-height:1.5;">' +
                       '💡 恭喜你沒有碰到高利貸！<br>遠離賭博，珍惜生命，擁抱美好人生！' +
                       '</div>' +
                       '<button class="ios-btn success" style="margin-top:20px;" onclick="location.reload()">再次體驗模擬器</button>';
    phoneFrame.appendChild(endDiv);
  }

  function nextDay() {
    if (state.day === 2 && !state.casinoInstalled) {
      playSound('error-pay');
      alert("【強制規定】第二天必須點擊阿偉傳來的娛樂城安裝檔並安裝「橘哥娛樂城」！");
      return;
    }
    if (state.casinoInstalled && state.spinsToday < 10) {
      playSound('error-pay');
      alert("【任務未完成】轉輪盤尚未達到 10 次！");
      return;
    }
    if (!state.currentBill.paid) {
      playSound('error-pay');
      alert("【財務未完成】今天必須在「未來支付」繳納帳單！");
      return;
    }

    let overdueLoans = state.loans.filter(l => state.day >= l.dueDay);

    if (state.loans.length > 0) {
      let totalDebt = state.loans.reduce((sum, l) => sum + l.amount, 0);

      if (state.loanWarningCount === 0) {
        state.loanWarningCount++;
        playSound('error-pay');
        alert("⚠️【還款提醒】您目前尚有 " + state.loans.length + " 筆高利貸欠款（總金額：NT$ " + totalDebt.toLocaleString() + "）。\n請前往「未來支付」點選【還款】！");
        openApp('futurePay');
        return;
      } 
      else if (state.loanWarningCount === 1) {
        state.loanWarningCount++;
        playSound('error-pay');
        alert("💡【借貸提醒】若您手頭現金不足以償還高利貸：\n可以點擊「借貸錢莊 App」點選【🔄 刷新更高額度】獲取資金來還款（以債養債）！");
        if (state.loanInstalled) {
          openApp('loan');
        } else {
          openApp('futurePay');
        }
        return;
      } 
      else if (overdueLoans.length > 0) {
        showBadEnding(totalDebt);
        return;
      }
    }

    let mask = document.getElementById("transition-mask");
    let transText = document.getElementById("transition-text");
    let nextD = state.day + 1;
    transText.innerText = "☀️ 正在進入第 " + nextD + " 天...";
    mask.classList.add("active");

    setTimeout(() => {
      state.day++;
      state.spinsToday = 0;
      state.loanVisitCount++;
      state.borrowedPlatforms = [];
      state.loanWarningCount = 0;

      if (state.day === 2) {
        state.contacts.friend.unread++;
        state.contacts.friend.messages.push({
          sender: "friend",
          text: "欸兄弟！我最近在『橘哥娛樂城』爽賺翻了！點下方圖片安裝試試！",
          isCasinoLink: true
        });
        triggerNotification("好友阿偉", "我在『橘哥娛樂城』爽賺翻了！點擊下方安裝檔...", "friend");
      }

      if (state.day === 10 && state.loans.length > 0) {
        state.contacts.wife.unread++;
        state.contacts.wife.messages.push({ sender: "wife", text: "老公！黑衣人跑到我們家裡來撒冥紙，把小朋友帶走了！你到底惹到誰了！" });
        triggerNotification("老婆", "黑衣人把小朋友帶走了！", "wife");
      }

      if (dailyConfig[state.day]) {
        state.currentBill = { name: dailyConfig[state.day].bill.name, amount: dailyConfig[state.day].bill.amount, paid: false };
        if (dailyConfig[state.day].wife && state.day !== 10) {
          state.contacts.wife.unread++;
          state.contacts.wife.messages.push({ sender: "wife", text: dailyConfig[state.day].wife });
          triggerNotification("老婆", dailyConfig[state.day].wife, "wife");
        }
      } else {
        state.currentBill = { name: "日常雜費與利息分期", amount: 7000, paid: false };
      }

      if (state.day > state.maxDays) {
        mask.classList.remove("active");
        if (state.loans.length === 0) {
          showGoodEnding();
        } else {
          let totalDebt = state.loans.reduce((sum, l) => sum + l.amount, 0);
          showBadEnding(totalDebt);
        }
        return;
      }

      updateUI();
      setTimeout(() => mask.classList.remove("active"), 400);
    }, 800);
  }

  updateUI();
</script>
