<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>橘哥娛樂城：30天 iOS 警世模擬器</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #000; color: #fff; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; user-select: none; }
    .iphone-frame { width: 390px; height: 810px; background: #1c1c1e; border-radius: 50px; border: 12px solid #3a3a3c; box-shadow: 0 20px 50px rgba(0,0,0,0.8); display: flex; flex-direction: column; overflow: hidden; position: relative; }
    .ios-status-bar { height: 44px; display: flex; justify-content: space-between; align-items: center; padding: 0 24px; font-size: 14px; font-weight: 600; color: #fff; background: transparent; z-index: 100; flex-shrink: 0; }
    .dynamic-island { width: 120px; height: 28px; background: #000; border-radius: 14px; position: absolute; left: 50%; transform: translateX(-50%); top: 8px; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #00ffcc; font-weight: bold; }
    .iphone-screen { flex: 1; background: linear-gradient(135deg, #1c2a38, #0f0f11); display: flex; flex-direction: column; overflow: hidden; position: relative; }
    .home-desktop { flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; }
    .news-banner { background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); border-radius: 14px; padding: 10px 12px; font-size: 12px; color: #f1f5f9; border: 1px solid rgba(255,255,255,0.15); display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
    .app-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; text-align: center; }
    .app-icon-container { display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; position: relative; }
    .app-icon { width: 60px; height: 60px; border-radius: 14px; display: flex; justify-content: center; align-items: center; font-size: 26px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); transition: transform 0.1s; }
    .app-icon:active { transform: scale(0.92); }
    .app-label { font-size: 11px; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.8); }
    .badge { position: absolute; top: -2px; right: 8px; background: #ff3b30; color: white; border-radius: 10px; font-size: 10px; padding: 2px 6px; font-weight: bold; display: none; }
    
    /* 即時 iOS 通知彈窗 */
    .ios-notification { position: absolute; top: 50px; left: 12px; right: 12px; background: rgba(40,40,40,0.95); backdrop-filter: blur(20px); border-radius: 16px; padding: 12px 14px; box-shadow: 0 10px 25px rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.2); z-index: 200; animation: slideDown 0.4s ease-out; cursor: pointer; }
    @keyframes slideDown { from { transform: translateY(-70px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    .app-view { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #121212; z-index: 50; display: flex; flex-direction: column; animation: slideUp 0.3s ease-out; }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .app-nav-bar { height: 50px; background: #1c1c1e; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid #333; flex-shrink: 0; }
    .app-body { flex: 1; overflow-y: auto; padding: 16px; }
    
    .ios-btn { width: 100%; padding: 12px; background: #007aff; color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; margin: 8px 0; text-align: center; }
    .ios-btn:active { opacity: 0.8; }
    .ios-btn.danger { background: #ff3b30; }
    .ios-btn.success { background: #34c759; }

    /* 拉霸動畫與外觀 */
    .slot-machine-box { background: #222; border-radius: 16px; padding: 14px; border: 2px solid #444; margin: 10px 0; box-shadow: inset 0 0 10px #000; }
    .slot-reels-container { display: flex; justify-content: center; gap: 8px; margin-bottom: 12px; }
    .slot-reel { width: 70px; height: 80px; background: #000; border-radius: 10px; border: 2px solid #ffd700; display: flex; justify-content: center; align-items: center; font-size: 38px; overflow: hidden; position: relative; }
    .slot-reel-inner { display: flex; flex-direction: column; align-items: center; position: absolute; }
    .spinning { animation: reelSpin 0.1s linear infinite; }
    @keyframes reelSpin { 0% { transform: translateY(0); } 100% { transform: translateY(-120px); } }

    /* 聊天室與語音 */
    .chat-bubble { max-width: 80%; padding: 10px 14px; border-radius: 16px; margin: 6px 0; font-size: 13px; line-height: 1.4; word-break: break-all; position: relative; }
    .chat-bubble.incoming { background: #262628; color: #fff; align-self: flex-start; border-bottom-left-radius: 4px; }
    .chat-bubble.outgoing { background: #007aff; color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
    .chat-bubble.link-box { background: #1e3a5f; border: 1px solid #007aff; cursor: pointer; }
    .unread-dot { width: 8px; height: 8px; background: #ff3b30; border-radius: 50%; display: inline-block; margin-left: 6px; }
    .voice-msg-btn { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.15); padding: 6px 12px; border-radius: 20px; cursor: pointer; width: fit-content; margin-top: 4px; }

    /* 過場天數牆 */
    .day-transition-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 300; display: flex; flex-direction: column; justify-content: center; align-items: center; animation: fadeInOut 1.8s ease-in-out forwards; }
    @keyframes fadeInOut { 0% { opacity: 0; } 30% { opacity: 1; } 70% { opacity: 1; } 100% { opacity: 0; pointer-events: none; } }
    
    .shake { animation: shakeAnim 0.4s ease-in-out; }
    @keyframes shakeAnim { 0%, 100% { transform: translate(0); } 20%, 60% { transform: translate(-8px, 6px); } 40%, 80% { transform: translate(8px, -6px); } }
  </style>
</head>
<body>

<div class="iphone-frame" id="phone-frame">
  <!-- iOS 狀態列 -->
  <div class="ios-status-bar">
    <span id="current-time">18:00</span>
    <div class="dynamic-island" id="day-badge">第 1 天</div>
    <span>5G 🔋</span>
  </div>

  <div class="iphone-screen" id="phone-screen">
    <!-- 主畫面桌面 -->
    <div class="home-desktop">
      
      <!-- 輪播新聞 -->
      <div class="news-banner" onclick="openApp('news')">
        <span id="news-ticker-text">📰 【即時新聞】理財專家警告：非法網路博弈與高利貸吸金陷阱頻傳...</span>
        <span style="font-size:11px; color:#aaa;">▶</span>
      </div>

      <!-- App 網格 -->
      <div class="app-grid">
        <div class="app-icon-container" onclick="openApp('futurePay')">
          <div class="app-icon" style="background: linear-gradient(135deg, #007aff, #00c6ff);">💳</div>
          <span class="app-label">未來支付</span>
        </div>
        <div class="app-icon-container" onclick="openApp('messages')">
          <div class="app-icon" style="background: linear-gradient(135deg, #34c759, #11998e);">💬</div>
          <span class="app-label">訊息</span>
          <div class="badge" id="total-msg-badge">0</div>
        </div>
        <div class="app-icon-container" onclick="openApp('ig')">
          <div class="app-icon" style="background: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045);">📸</div>
          <span class="app-label">IG</span>
        </div>
        <div class="app-icon-container" id="casino-app-icon" style="display:none;" onclick="openApp('casino')">
          <div class="app-icon" style="background: linear-gradient(135deg, #ff9500, #ff3b30);">🎲</div>
          <span class="app-label">橘哥娛樂城</span>
        </div>
        <div class="app-icon-container" id="loan-app-icon" style="display:none;" onclick="openApp('loan')">
          <div class="app-icon" style="background: linear-gradient(135deg, #5856d6, #3226a0);">💰</div>
          <span class="app-label">借貸錢莊</span>
        </div>
      </div>

      <!-- 底部日常任務卡片 (動態抓馬開銷與 10 次旋轉強制要求) -->
      <div style="background: rgba(0,0,0,0.6); border-radius: 16px; padding: 12px; border: 1px solid rgba(255,255,255,0.15); margin-top: auto;">
        <h3 id="story-title" style="margin:0 0 4px 0; color:#00ffcc; font-size:15px;">第 1 天</h3>
        <div id="day-task-status" style="font-size:11px; color:#ff9500; margin-bottom:6px; line-height:1.3;">📌 今日待辦：查看家人訊息，在未來支付處理日常開銷。</div>
        <button class="ios-btn success" id="next-day-btn" onclick="nextDay()">結束今天，進入明天</button>
      </div>

    </div>
  </div>
</div>

<script>
  // 音效系統 (Web Audio API)
  const AudioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function playSound(type) {
    if (AudioCtx.state === 'suspended') AudioCtx.resume();
    const osc = AudioCtx.createOscillator();
    const gain = AudioCtx.createGain();
    osc.connect(gain);
    gain.connect(AudioCtx.destination);

    if (type === 'msg') {
      osc.frequency.setValueAtTime(587.33, AudioCtx.currentTime); 
      osc.frequency.setValueAtTime(880, AudioCtx.currentTime + 0.1); 
      gain.gain.setValueAtTime(0.2, AudioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, AudioCtx.currentTime + 0.3);
      osc.start(); osc.stop(AudioCtx.currentTime + 0.3);
    } else if (type === 'spin') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(150, AudioCtx.currentTime);
      gain.gain.setValueAtTime(0.1, AudioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, AudioCtx.currentTime + 0.1);
      osc.start(); osc.stop(AudioCtx.currentTime + 0.1);
    } else if (type === 'win') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(523.25, AudioCtx.currentTime);
      osc.frequency.setValueAtTime(659.25, AudioCtx.currentTime + 0.1);
      osc.frequency.setValueAtTime(783.99, AudioCtx.currentTime + 0.2);
      gain.gain.setValueAtTime(0.3, AudioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, AudioCtx.currentTime + 0.5);
      osc.start(); osc.stop(AudioCtx.currentTime + 0.5);
    } else if (type === 'lose') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(200, AudioCtx.currentTime);
      osc.frequency.setValueAtTime(100, AudioCtx.currentTime + 0.15);
      gain.gain.setValueAtTime(0.3, AudioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, AudioCtx.currentTime + 0.4);
      osc.start(); osc.stop(AudioCtx.currentTime + 0.4);
    } else if (type === 'error') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(130, AudioCtx.currentTime);
      osc.frequency.setValueAtTime(90, AudioCtx.currentTime + 0.15);
      gain.gain.setValueAtTime(0.3, AudioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, AudioCtx.currentTime + 0.35);
      osc.start(); osc.stop(AudioCtx.currentTime + 0.35);
    }
  }

  function playVoiceSynth(text) {
    playSound('msg');
    if ('speechSynthesis' in window) {
      let utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'zh-TW';
      utterance.rate = 1.0;
      window.speechSynthesis.speak(utterance);
    } else {
      alert(`🔊 語音播放: "${text}"`);
    }
  }

  // 每日生活開銷劇本資料庫
  const dailyBillsConfig = {
    1: { name: "家庭伙食與日常用品費", amount: 3000 },
    3: { name: "小孩幼兒園才藝班學費", amount: 8000 },
    4: { name: "本月房屋租金與水電費", amount: 20000 },
    6: { name: "父母親慢性病藥品與保健費", amount: 6000 },
    8: { name: "全家醫療與機車強制險", amount: 5000 },
    11: { name: "小孩學校校外教學與餐費", amount: 4000 },
    13: { name: "家庭聚餐與親友紅包", amount: 6000 },
    15: { name: "房屋貸款分期利息", amount: 15000 },
    18: { name: "汽車維修與燃料稅", amount: 8000 },
    21: { name: "父母親生活補助費", amount: 10000 },
    24: { name: "小孩下學期學雜費預繳", amount: 12000 },
    27: { name: "水電瓦斯與管理費", amount: 4500 }
  };

  // 核心遊戲數據
  let state = {
    day: 1,
    maxDays: 30,
    cash: 35000,
    currentBill: { name: "開局現金點交與家用準備", amount: 3000, paid: true },
    loans: [],
    casinoInstalled: false,
    loanInstalled: false,
    spinsToday: 0,
    contacts: {
      wife: { name: "老婆", avatar: "👩", unread: 1, messages: [{ sender: "wife", text: "老公，今天發薪水辛苦啦！晚上煮了你愛吃的紅燒肉，記得早點回家喔 ❤️", voice: "老公，今天發薪水辛苦啦，晚上記得早點回家吃飯喔！" }] },
      child: { name: "小孩", avatar: "👦", unread: 1, messages: [{ sender: "child", text: "爸爸！我今天考了 95 分喔！可以帶一杯奶茶給我嗎？", voice: "爸爸，我今天考了95分喔！" }] },
      friend: { name: "好友阿偉", avatar: "🧔", unread: 0, messages: [{ sender: "friend", text: "兄弟，最近過得怎樣？有空出來喝一杯啊！" }] }
    }
  };

  function updateUI() {
    document.getElementById("day-badge").innerText = `第 ${state.day} 天`;
    document.getElementById("story-title").innerText = `第 ${state.day} 天`;

    // 計算總未讀數
    let totalUnread = 0;
    for (let k in state.contacts) { totalUnread += state.contacts[k].unread; }
    let badgeEl = document.getElementById("total-msg-badge");
    if (totalUnread > 0) {
      badgeEl.innerText = totalUnread;
      badgeEl.style.display = "block";
    } else {
      badgeEl.style.display = "none";
    }

    // 任務指示器
    let taskEl = document.getElementById("day-task-status");
    let spinsLeft = Math.max(0, 10 - state.spinsToday);
    let billStatus = state.currentBill.paid ? "✅ 今日帳單已繳納" : `⏳ 待繳: ${state.currentBill.name} (NT$ ${state.currentBill.amount.toLocaleString()})`;

    if (state.day === 2 && !state.casinoInstalled) {
      taskEl.innerText = "📌 今日待辦：查看訊息安裝「橘哥娛樂城」 | " + billStatus;
    } else {
      taskEl.innerText = `📌 今日待辦：轉輪盤 (${spinsLeft}/10次) | ${billStatus}`;
    }
  }

  // 即時跳出 iOS 頂部通知
  function triggerNotification(senderName, text, contactKey) {
    playSound('msg');
    let screen = document.getElementById("phone-screen");
    let notif = document.createElement("div");
    notif.className = "ios-notification";
    notif.innerHTML = `
      <div style="display:flex; justify-content:space-between; align-items:center; font-size:11px; color:#aaa; margin-bottom:4px;">
        <span>💬 訊息</span><span>現在</span>
      </div>
      <div style="font-weight:bold; font-size:13px; color:#fff;">${senderName}</div>
      <div style="font-size:12px; color:#ddd; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${text}</div>
    `;
    notif.onclick = () => {
      notif.remove();
      openChat(contactKey);
    };
    screen.appendChild(notif);
    setTimeout(() => { if (notif.parentNode) notif.remove(); }, 4000);
  }

  function openApp(appId) {
    let screen = document.getElementById("phone-screen");
    let existing = document.getElementById("active-app-view");
    if (existing) existing.remove();

    let view = document.createElement("div");
    view.id = "active-app-view";
    view.className = "app-view";
    
    let html = `<div class="app-nav-bar">
      <span style="font-weight:600; font-size:15px;">${getAppTitle(appId)}</span>
      <span onclick="closeApp()" style="color:#007aff; cursor:pointer; font-weight:600;">關閉</span>
    </div><div class="app-body">`;

    if (appId === 'futurePay') {
      let totalLoan = state.loans.reduce((sum, l) => sum + l.amount, 0);
      html += `
        <div style="background:#1c1c1e; padding:14px; border-radius:14px; margin-bottom:10px; border:1px solid #333;">
          <div style="font-size:11px; color:#aaa;">未來支付 - 當前可用現金餘額</div>
          <div style="font-size:24px; font-weight:bold; color:${state.cash<0?'#ff3b30':'#34c759'}; margin-top:2px;">NT$ ${state.cash.toLocaleString()}</div>
        </div>
        <div style="background:#1c1c1e; padding:14px; border-radius:14px; margin-bottom:10px; border:1px solid #333;">
          <div style="font-size:11px; color:#aaa;">地下高利貸累積總欠款</div>
          <div style="font-size:22px; font-weight:bold; color:#ff3b30; margin-top:2px;">NT$ ${totalLoan.toLocaleString()}</div>
        </div>
        
        <div style="background:#1c1c1e; padding:14px; border-radius:14px; border:1px solid #333;">
          <div style="font-size:13px; font-weight:bold; margin-bottom:6px;">💳 今日必須繳納項目</div>
          {!state.currentBill.paid ? `
            <div style="display:flex; justify-content:space-between; align-items:center; padding:6px 0;">
              <div><div style="font-size:12px;">${state.currentBill.name}</div><div style="font-size:10px; color:#aaa;">金額: NT$ ${state.currentBill.amount.toLocaleString()}</div></div>
              <button class="ios-btn danger" style="width:auto; padding:6px 10px; font-size:11px; margin:0;" onclick="payBill()">手動繳納</button>
            </div>
          ` : '<div style="font-size:12px; color:#34c759;">✅ 今日生活開銷與帳單已全數繳清！</div>'}
        </div>
      `;
    } else if (appId === 'messages') {
      html += `<div style="display:flex; flex-direction:column; gap:10px;">`;
      for (let key in state.contacts) {
        let c = state.contacts[key];
        let lastMsg = c.messages[c.messages.length - 1].text;
        html += `<div onclick="openChat('${key}')" style="background:#2c2c2e; padding:12px; border-radius:12px; display:flex; align-items:center; gap:12px; cursor:pointer;">
          <div style="font-size:26px; background:#3a3a3c; width:44px; height:44px; border-radius:50%; display:flex; justify-content:center; align-items:center; position:relative;">
            ${c.avatar}
          </div>
          <div style="flex:1; overflow:hidden;">
            <div style="font-weight:600; font-size:14px; display:flex; justify-content:space-between;">
              <span>${c.name}</span>
              ${c.unread > 0 ? `<span style="font-size:10px; background:#ff3b30; color:#fff; padding:1px 6px; border-radius:10px;">未讀 ${c.unread}</span>` : ''}
            </div>
            <div style="font-size:12px; color:#aaa; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${lastMsg}</div>
          </div>
        </div>`;
      }
      html += `</div>`;
    } else if (appId === 'casino') {
      let canHighStake = state.day >= 5; // 第五天解鎖一萬與五萬
      let allInUnlocked = state.day >= 10; // 鎖卡鍵/梭哈必須達天數 10 天才開啟

      html += `
        <div style="text-align:center;">
          <h2 style="color:#ff9500; margin-top:0; font-size:18px;">🎲 橘哥娛樂城 (今日轉動: ${state.spinsToday}/10)</h2>
          <p style="font-size:11px; color:#aaa; margin:4px 0;">即時餘額：<b id="casino-live-cash" style="color:#34c759;">NT$ ${state.cash.toLocaleString()}</b></p>
          
          <div class="slot-machine-box">
            <div class="slot-reels-container">
              <div class="slot-reel"><div class="slot-reel-inner" id="reel-1">🎰</div></div>
              <div class="slot-reel"><div class="slot-reel-inner" id="reel-2">🎰</div></div>
              <div class="slot-reel"><div class="slot-reel-inner" id="reel-3">🎰</div></div>
            </div>
            <div id="gamble-res" style="font-weight:bold; font-size:13px; min-height:18px; color:#ff9500;"></div>
          </div>

          <div style="display:grid; grid-template-columns: repeat(2, 1fr); gap:6px; margin-bottom:8px;">
            <button class="ios-btn" style="margin:0; padding:10px; font-size:13px;" onclick="playSlotAnimation(1000)">下注 1,000</button>
            <button class="ios-btn" style="margin:0; padding:10px; font-size:13px;" onclick="playSlotAnimation(5000)">下注 5,000</button>
            ${canHighStake ? `
              <button class="ios-btn" style="margin:0; padding:10px; font-size:13px;" onclick="playSlotAnimation(10000)">下注 10,000</button>
              <button class="ios-btn" style="margin:0; padding:10px; font-size:13px;" onclick="playSlotAnimation(50000)">下注 50,000</button>
            ` : `<div style="grid-column: span 2; font-size:10px; color:#aaa; background:#222; padding:6px; border-radius:6px;">🔒 下注 1萬/5萬額度：需至第 5 天解鎖</div>`}
          </div>

          ${allInUnlocked ? `<button class="ios-btn danger" onclick="playSlotAnimation(state.cash)" style="font-size:14px; background:#ff2d55; padding:10px;">🔥 梭哈 (All-in)</button>` : `<div style="font-size:10px; color:#aaa; background:#222; padding:8px; border-radius:8px; border:1px dashed #444;">🔒 梭哈與高風險解鎖：需達成遊戲天數 10 天 (目前第 ${state.day} 天)</div>`}
        </div>
      `;
    } else if (appId === 'loan') {
      html += `
        <p style="font-size:11px; color:#aaa; margin-top:0;">地下融資借貸平台（日息利滾利）：</p>
        <div style="background:#2c2c2e; padding:10px; border-radius:10px; margin-bottom:8px;">
          <b>橘速貸 (日息 10%)</b>
          <div style="font-size:10px; color:#aaa; margin:2px 0;">快速撥款 NT$ 30,000</div>
          <button class="ios-btn" style="padding:6px; font-size:12px; margin:0;" onclick="requestLoan('橘速貸', 30000, 0.1)">立即申貸</button>
        </div>
        <div style="background:#2c2c2e; padding:10px; border-radius:10px;">
          <b>黑貓錢莊 (日息 20%)</b>
          <div style="font-size:10px; color:#aaa; margin:2px 0;">快速撥款 NT$ 100,000</div>
          <button class="ios-btn danger" style="padding:6px; font-size:12px; margin:0;" onclick="requestLoan('黑貓錢莊', 100000, 0.2)">立即申貸</button>
        </div>
      `;
    } else if (appId === 'ig') {
      html += `
        <div style="background:#1a1a1a; border-radius:12px; padding:10px; border:1px solid #333;">
          <div style="display:flex; align-items:center; gap:8px; font-size:12px; font-weight:bold; margin-bottom:8px;">
            <div style="width:28px; height:28px; border-radius:50%; background:#ff9500; display:flex; justify-content:center; align-items:center;">👑</div>
            <span>橘哥官方社群 @boss_orange</span>
          </div>
          <div style="height:120px; background:#333; border-radius:8px; display:flex; justify-content:center; align-items:center; font-size:32px;">🏎️💸</div>
          <p style="font-size:11px; color:#ddd; margin-top:8px;">跟著橘哥團隊買，不到三天把車貸房貸全清光！想翻身立刻私訊我！🔥</p>
        </div>
      `;
    }

    html += `</div>`;
    view.innerHTML = html;
    screen.appendChild(view);
  }

  function getAppTitle(id) {
    let map = { futurePay: '💳 未來支付', messages: '💬 訊息', ig: '📸 Instagram', casino: '🎲 橘哥娛樂城', loan: '💰 借貸錢莊' };
    return map[id] || 'App';
  }

  function closeApp() {
    let v = document.getElementById("active-app-view");
    if (v) v.remove();
  }

  function openChat(contactKey) {
    let c = state.contacts[contactKey];
    c.unread = 0;
    updateUI();

    let screen = document.getElementById("phone-screen");
    let view = document.createElement("div");
    view.className = "app-view";
    
    let html = `
      <div class="app-nav-bar">
        <span style="font-weight:600; font-size:15px;">${c.avatar} ${c.name}</span>
        <span onclick="this.closest('.app-view').remove()" style="color:#007aff; cursor:pointer; font-weight:600;">返回</span>
      </div>
      <div class="app-body" id="chat-box" style="display:flex; flex-direction:column; gap:8px;">
    `;
    c.messages.forEach(m => {
      let type = m.sender === 'user' ? 'outgoing' : 'incoming';
      html += `<div class="chat-bubble ${type}">
        <div>${m.text}</div>
        ${m.voice ? `<div class="voice-msg-btn" onclick="playVoiceSynth('${m.voice}')">🔊 語音訊息 (點擊播放)</div>` : ''}
      </div>`;
      if (m.isCasinoLink) {
        html += `<div class="chat-bubble incoming link-box" onclick="installCasino()">
          <b>🎰 點擊下載「橘哥娛樂城 App」</b><br><span style="font-size:11px; opacity:0.8;">阿偉發來的專屬邀請連結</span>
        </div>`;
      }
      if (m.isLoanLink) {
        html += `<div class="chat-bubble incoming link-box" onclick="installLoan()">
          <b>💰 點擊下載「借貸錢莊 App」</b><br><span style="font-size:11px; opacity:0.8;">阿偉推薦的快速借貸管道</span>
        </div>`;
      }
    });
    html += `</div>`;
    view.innerHTML = html;
    screen.appendChild(view);
  }

  function payBill() {
    if (state.cash < state.currentBill.amount) {
      alert("【餘額不足】未來支付現金不足，無法繳納今日帳單！請注意信用破產風險。");
      return;
    }
    state.cash -= state.currentBill.amount;
    state.currentBill.paid = true;
    alert(`✅ 成功繳納「${state.currentBill.name}」NT$ ${state.currentBill.amount.toLocaleString()}！`);
    closeApp();
    openApp('futurePay');
    updateUI();
  }

  function installCasino() {
    if (state.casinoInstalled) return;
    alert("📲 「橘哥娛樂城 App」安裝完成！已新增至手機桌面。");
    state.casinoInstalled = true;
    document.getElementById("casino-app-icon").style.display = "flex";
    closeApp();
    updateUI();
  }

  function installLoan() {
    if (state.loanInstalled) return;
    alert("📲 「借貸錢莊 App」安裝完成！已新增至手機桌面。");
    state.loanInstalled = true;
    document.getElementById("loan-app-icon").style.display = "flex";
    closeApp();
    updateUI();
  }

  // 拉霸機滾輪動畫與前五天上限限制
  function playSlotAnimation(amount) {
    if (state.day <= 5 && amount > 5000) {
      alert("【防沉迷限制】前 5 天平台規範：單筆投注金額不得超過 NT$ 5,000！");
      return;
    }
    if (amount <= 0 || state.cash < amount) {
      alert("現金不足！");
      return;
    }

    let r1 = document.getElementById("reel-1");
    let r2 = document.getElementById("reel-2");
    let r3 = document.getElementById("reel-3");
    let resEl = document.getElementById("gamble-res");

    r1.className = "slot-reel-inner spinning";
    r2.className = "slot-reel-inner spinning";
    r3.className = "slot-reel-inner spinning";
    resEl.innerText = "旋轉中...";
    playSound('spin');

    setTimeout(() => {
      let isWin = false;
      
      if (state.day === 2) isWin = Math.random() < 0.85;
      else if (state.day === 3) isWin = Math.random() < 0.70;
      else if (state.day === 4) isWin = Math.random() < 0.35; // 第四天強制輸光鋪墊
      else {
        let winRate = Math.max(0.12, 0.50 - (state.day * 0.015));
        isWin = Math.random() < winRate;
      }

      r1.className = "slot-reel-inner";
      r2.className = "slot-reel-inner";
      r3.className = "slot-reel-inner";

      if (isWin) {
        r1.innerText = "7️⃣"; r2.innerText = "7️⃣"; r3.innerText = "7️⃣";
        let win = Math.floor(amount * 1.5);
        state.cash += win;
        resEl.style.color = "#34c759";
        resEl.innerText = `🎉 中大獎！贏得 NT$ ${win.toLocaleString()}`;
        playSound('win');
      } else {
        r1.innerText = "🍒"; r2.innerText = "💎"; r3.innerText = "7️⃣";
        state.cash -= amount;
        resEl.style.color = "#ff3b30";
        resEl.innerText = `😢 未中獎，損失 NT$ ${amount.toLocaleString()}`;
        playSound('lose');
        document.getElementById("phone-frame").classList.add("shake");
        setTimeout(() => document.getElementById("phone-frame").classList.remove("shake"), 400);
      }

      state.spinsToday++;
      let liveCashEl = document.getElementById("casino-live-cash");
      if (liveCashEl) liveCashEl.innerText = `NT$ ${state.cash.toLocaleString()}`;
      updateUI();

      // 條件觸發：未滿 1 萬或第四天強制推播網貸
      if ((state.cash < 10000 || state.day === 4) && !state.loanInstalled && state.casinoInstalled) {
        setTimeout(() => {
          state.contacts.friend.unread++;
          state.contacts.friend.messages.push({
            sender: "friend",
            text: "兄弟，看你現金快見底了？別擔心！我都在這個『借貸錢莊 App』拿週轉金，三秒撥款，快載來借錢翻盤！",
            isLoanLink: true
          });
          triggerNotification("好友阿偉", "兄弟，看你現金快見底了？我都在這個『借貸錢莊』...", "friend");
          updateUI();
        }, 600);
      }

    }, 1200);
  }

  function requestLoan(name, amount, rate) {
    if (confirm(`【實名認證】確定向「${name}」申貸 NT$ ${amount.toLocaleString()}？需要進行 AI 拍臉驗證`)) {
      alert("✅ 臉部識別成功！資金已匯入「未來支付」。");
      state.loans.push({ name: name, amount: amount, rate: rate });
      state.cash += amount;
      closeApp();
      updateUI();
    }
  }

  // 進入下一天 (每日 10 次強制旋轉、帳單扣款、網貸利息日日提醒與抓馬結局編排)
  function nextDay() {
    if (state.casinoInstalled && state.spinsToday < 10) {
      playSound('error');
      alert(`【今日任務未完成】每一天都必須在「橘哥娛樂城」轉滿 10 次輪盤才能過明天！(目前進度: ${state.spinsToday}/10 次)`);
      return;
    }
    if (!state.currentBill.paid) {
      playSound('error');
      alert(`【財務未完成】今天必須在「未來支付」繳納「${state.currentBill.name}」NT$ ${state.currentBill.amount.toLocaleString()}！`);
      return;
    }

    // 過場天數動畫
    let overlay = document.createElement("div");
    overlay.className = "day-transition-overlay";
    overlay.innerHTML = `<h1 style="font-size:28px; color:#fff; font-weight:300;">第 ${state.day + 1} 天</h1>`;
    document.getElementById("phone-screen").appendChild(overlay);
    setTimeout(() => overlay.remove(), 1800);

    state.day++;
    state.spinsToday = 0;

    // 計算高利貸利滾利，並發送每日網貸欠款提醒
    let totalLoanAmount = 0;
    state.loans.forEach(l => {
      l.amount = Math.floor(l.amount * (1 + l.rate));
      totalLoanAmount += l.amount;
    });

    if (state.loans.length > 0) {
      setTimeout(() => {
        state.contacts.loanSys = { name: "地下融資催收處", avatar: "⚠️", unread: 1, messages: [{ sender: "loanSys", text: `【帳單提醒】您目前高利貸總欠款已滾雪球來到 NT$ ${totalLoanAmount.toLocaleString()}，今日利息已計入，請盡速還款否則後果自負！` }] };
        triggerNotification("地下融資催收處", `總欠款已達 NT$ ${totalLoanAmount.toLocaleString()}，請盡速還款！`, "loanSys");
        updateUI();
      }, 1000);
    }

    // 指派隔日帳單
    if (dailyBillsConfig[state.day]) {
      state.currentBill = { name: dailyBillsConfig[state.day].name, amount: dailyBillsConfig[state.day].amount, paid: false };
    } else {
      state.currentBill = { name: "日常生活雜費與利息分期", amount: 7000, paid: false };
    }

    // 劇情事件推進
    if (state.day === 2) {
      state.contacts.friend.unread++;
      state.contacts.friend.messages.push({
        sender: "friend",
        text: "欸兄弟！我最近在『橘哥娛樂城』爽賺翻了！連結發你，趕快上車！",
        isCasinoLink: true
      });
      triggerNotification("好友阿偉", "欸兄弟！我最近在『橘哥娛樂城』爽賺翻了！...", "friend");
    }

    if (state.day === 20) {
      state.contacts.collector = { name: "討債專員-虎哥", avatar: "🕶️", unread: 1, messages: [{ sender: "collector", text: "林先生，聽說你躲得很開心？我們已經知道你家地址跟小孩學校在哪了，明天中午前沒看到錢，自己小心點。" }] };
      triggerNotification("討債專員-虎哥", "我們已經知道你家地址跟小孩學校在哪了...", "collector");
    }

    if (state.day === 23) {
      state.contacts.wife.unread++;
      state.contacts.wife.messages.push({
        sender: "wife",
        text: "老公...家裡存摺怎麼全空了？剛剛討債的人打電話給婆婆，老人家氣到心臟病發送急診！你到底在外面惹了什麼禍？",
        voice: "老公，家裡存摺怎麼全空了？婆婆氣到心臟病發送急診了啦！"
      });
      triggerNotification("老婆", "家裡存摺怎麼全空了？婆婆氣到心臟病發送急診...", "wife");
    }

    if (state.day === 26) {
      state.contacts.wife.unread++;
      state.contacts.wife.messages.push({
        sender: "wife",
        text: "我已經受夠了！這日子沒法過了。我帶著孩子回娘家，離婚協議書我放在桌上，你去找你的賭博過一輩子吧！",
        voice: "我已經受夠了，我帶著孩子回娘家，離婚協議書放在桌上！"
      });
      triggerNotification("老婆", "我帶著孩子回娘家了，離婚協議書放在桌上...", "wife");
    }

    if (state.day === 29) {
      state.contacts.collector = { name: "討債專員-虎哥", avatar: "🕶️", unread: 1, messages: [{ sender: "collector", text: "碰！大門被砸的聲音。小子，限你三小時內生出 50 萬，不然今天砍你一隻手！" }] };
      triggerNotification("討債專員-虎哥", "限你三小時內生出 50 萬，不然今天砍你一隻手！", "collector");
    }

    if (state.day > state.maxDays) {
      alert("【悲劇結局：家破人亡】\n\n因沉迷線上博弈與地下高利貸，你不但輸光了積蓄、氣死至親，妻子也帶著孩子絕望離去。面對排山倒海的債務與黑衣人的暴力逼債，你在冰冷的房間中留下一封遺書，結束了一生。\n\n警語：回頭是岸，遠離賭博，珍惜摯愛。");
      location.reload();
      return;
    }

    updateUI();
  }

  updateUI();
</script>
