<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>橘哥娛樂城：15天 iOS 警世模擬器</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #000; color: #fff; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; user-select: none; }
    .iphone-frame { width: 390px; height: 810px; background: #1c1c1e; border-radius: 50px; border: 12px solid #3a3a3c; box-shadow: 0 20px 50px rgba(0,0,0,0.8); display: flex; flex-direction: column; overflow: hidden; position: relative; }
    .ios-status-bar { height: 44px; display: flex; justify-content: space-between; align-items: center; padding: 0 24px; font-size: 14px; font-weight: 600; color: #fff; background: transparent; z-index: 100; flex-shrink: 0; }
    .dynamic-island { width: 120px; height: 28px; background: #000; border-radius: 14px; position: absolute; left: 50%; transform: translateX(-50%); top: 8px; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #00ffcc; font-weight: bold; }
    .iphone-screen { flex: 1; background: linear-gradient(135deg, #1c2a38, #0f0f11); display: flex; flex-direction: column; overflow: hidden; position: relative; }
    .home-desktop { flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; }
    .news-banner { background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); border-radius: 14px; padding: 10px 12px; font-size: 12px; color: #f1f5f9; border: 1px solid rgba(255,255,255,0.15); display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
    .app-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; text-align: center; }
    .app-icon-container { display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; position: relative; }
    .app-icon { width: 60px; height: 60px; border-radius: 14px; display: flex; justify-content: center; align-items: center; font-size: 26px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); transition: transform 0.1s; }
    .app-icon:active { transform: scale(0.92); }
    .app-label { font-size: 11px; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.8); }
    .badge { position: absolute; top: -2px; right: 8px; background: #ff3b30; color: white; border-radius: 10px; font-size: 10px; padding: 2px 6px; font-weight: bold; display: none; }
    
    .ios-notification { position: absolute; top: 50px; left: 12px; right: 12px; background: rgba(30,30,30,0.95); backdrop-filter: blur(20px); border-radius: 16px; padding: 12px 14px; box-shadow: 0 10px 25px rgba(0,0,0,0.6); border: 1px solid rgba(0,255,100,0.3); z-index: 200; animation: slideDown 0.4s ease-out; cursor: pointer; }
    @keyframes slideDown { from { transform: translateY(-70px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    .success-popup { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); background: rgba(20,20,20,0.95); border: 2px solid #34c759; border-radius: 20px; padding: 24px; text-align: center; z-index: 500; box-shadow: 0 15px 35px rgba(0,0,0,0.8); animation: popIn 0.3s ease-out; }
    .error-popup { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); background: rgba(30,10,10,0.95); border: 2px solid #ff3b30; border-radius: 20px; padding: 24px; text-align: center; z-index: 500; box-shadow: 0 15px 35px rgba(0,0,0,0.8); animation: popIn 0.3s ease-out; }
    @keyframes popIn { 0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; } 100% { transform: translate(-50%, -50%) scale(1); opacity: 1; } }

    .face-verify-modal { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); z-index: 400; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; text-align: center; animation: fadeIn 0.3s ease-out; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .day-transition-mask { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 600; display: flex; flex-direction: column; justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: opacity 0.5s ease; }
    .day-transition-mask.active { opacity: 1; pointer-events: auto; }

    .ending-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 700; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 24px; text-align: center; box-sizing: border-box; animation: fadeIn 0.8s ease-out; }

    .app-view { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #121212; z-index: 50; display: flex; flex-direction: column; animation: slideUp 0.3s ease-out; }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .app-nav-bar { height: 50px; background: #1c1c1e; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid #333; flex-shrink: 0; }
    .app-body { flex: 1; overflow-y: auto; padding: 16px; }
    
    .ios-btn { width: 100%; padding: 12px; background: #007aff; color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; margin: 8px 0; text-align: center; }
    .ios-btn:active { opacity: 0.8; }
    .ios-btn.danger { background: #ff3b30; }
    .ios-btn.success { background: #34c759; }
    .ios-btn:disabled { background: #444; color: #888; cursor: not-allowed; }

    .slot-machine-box { background: #222; border-radius: 16px; padding: 14px; border: 2px solid #444; margin: 10px 0; box-shadow: inset 0 0 10px #000; text-align: center; }
    .slot-reels-container { display: flex; justify-content: center; gap: 8px; margin-bottom: 12px; }
    .slot-reel { width: 70px; height: 80px; background: #000; border-radius: 10px; border: 2px solid #ffd700; display: flex; justify-content: center; align-items: center; font-size: 38px; overflow: hidden; position: relative; }
    .slot-reel-inner { display: flex; flex-direction: column; align-items: center; position: absolute; }
    .spinning { animation: reelSpin 0.1s linear infinite; }
    @keyframes reelSpin { 0% { transform: translateY(0); } 100% { transform: translateY(-120px); } }

    .chat-bubble { max-width: 80%; padding: 10px 14px; border-radius: 16px; margin: 6px 0; font-size: 13px; line-height: 1.4; word-break: break-all; }
    .chat-bubble.incoming { background: #262628; color: #fff; align-self: flex-start; }
    .chat-bubble.outgoing { background: #00b900; color: #fff; align-self: flex-end; }
    .chat-bubble.link-box { background: #1c2a38; border: 2px solid #ff9500; cursor: pointer; padding: 8px; text-align: center; }
    .voice-msg-btn { display: inline-block; background: rgba(255,255,255,0.15); padding: 4px 10px; border-radius: 12px; cursor: pointer; margin-top: 6px; font-size: 11px; color: #00ffcc; }

    .shake { animation: shakeAnim 0.4s ease-in-out; }
    @keyframes shakeAnim { 0%, 100% { transform: translate(0); } 20%, 60% { transform: translate(-8px, 6px); } 40%, 80% { transform: translate(8px, -6px); } }

    /* 版權宣告樣式 */
    .app-watermark { text-align: center; font-size: 8.5px; color: rgba(255, 255, 255, 0.28); letter-spacing: 0.3px; padding: 5px 4px 2px 4px; font-family: -apple-system, monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  </style>
</head>
<body>

<div class="iphone-frame" id="phone-frame">
  <div class="day-transition-mask" id="transition-mask">
    <h2 id="transition-text" style="color:#00ffcc; font-size:24px; margin:0;">☀️ 正在進入第 2 天...</h2>
  </div>

  <div class="ios-status-bar">
    <span id="current-time">18:00</span>
    <div class="dynamic-island" id="day-badge">第 1 天</div>
    <span>5G 🔋</span>
  </div>

  <div class="iphone-screen" id="phone-screen">
    <div class="home-desktop">
      <div class="news-banner" onclick="playSound('click'); openApp('news')">
        <span id="news-ticker-text">📰 【即時新聞】理財專家警告：非法網路博弈與高利貸吸金陷阱頻傳...</span>
        <span style="font-size:11px; color:#aaa;">▶</span>
      </div>

      <div class="app-grid">
        <div class="app-icon-container" onclick="playSound('click'); openApp('futurePay')">
          <div class="app-icon" style="background: linear-gradient(135deg, #007aff, #00c6ff);">💳</div>
          <span class="app-label">未來支付</span>
        </div>
        <div class="app-icon-container" onclick="playSound('click'); openApp('messages')">
          <div class="app-icon" style="background: linear-gradient(135deg, #00b900, #009900);">💬</div>
          <span class="app-label">Line 訊息</span>
          <div class="badge" id="total-msg-badge">0</div>
        </div>
        <div class="app-icon-container" onclick="playSound('click'); openApp('ig')">
          <div class="app-icon" style="background: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045);">📸</div>
          <span class="app-label">IG</span>
        </div>
        <div class="app-icon-container" id="casino-app-icon" style="display:none;" onclick="playSound('click'); openApp('casino')">
          <div class="app-icon" style="background: linear-gradient(135deg, #ff9500, #ff3b30);">🎲</div>
          <span class="app-label">橘哥娛樂城</span>
        </div>
        <div class="app-icon-container" id="loan-app-icon" style="display:none;" onclick="playSound('click'); openApp('loan')">
          <div class="app-icon" style="background: linear-gradient(135deg, #5856d6, #3226a0);">💰</div>
          <span class="app-label">借貸錢莊</span>
        </div>
      </div>

      <div style="background: rgba(0,0,0,0.6); border-radius: 16px; padding: 12px; border: 1px solid rgba(255,255,255,0.15); margin-top: auto;">
        <h3 id="story-title" style="margin:0 0 4px 0; color:#00ffcc; font-size:15px;">第 1 天</h3>
        <div id="day-task-status" style="font-size:11px; color:#ff9500; margin-bottom:6px; line-height:1.3;">📌 待辦事項：處理今日帳單開銷。</div>
        <button class="ios-btn success" onclick="playSound('click'); nextDay()">結束今天，進入明天</button>
      </div>
      
      <!-- 底部著作權宣告格式 -->
      <div class="app-watermark">© 2026 LIL_TUC888. All Rights Reserved. 版權所有，禁止未經授權之轉載或商業使用。</div>
    </div>
  </div>
</div>
