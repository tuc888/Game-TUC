<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>橘哥娛樂城：15天 iOS 警世模擬器</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #000; color: #fff; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; user-select: none; }
    .iphone-frame { width: 390px; height: 810px; background: #1c1c1e; border-radius: 50px; border: 12px solid #3a3a3c; box-shadow: 0 20px 50px rgba(0,0,0,0.8); display: flex; flex-direction: column; overflow: hidden; position: relative; }
    .ios-status-bar { height: 44px; display: flex; justify-content: space-between; align-items: center; padding: 0 24px; font-size: 14px; font-weight: 600; color: #fff; background: transparent; z-index: 100; flex-shrink: 0; }
    .dynamic-island { width: 120px; height: 28px; background: #000; border-radius: 14px; position: absolute; left: 50%; transform: translateX(-50%); top: 8px; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #00ffcc; font-weight: bold; }
    .iphone-screen { flex: 1; background: linear-gradient(135deg, #1c2a38, #0f0f11); display: flex; flex-direction: column; overflow: hidden; position: relative; }
    .home-desktop { flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; }
    .news-banner { background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); border-radius: 14px; padding: 10px 12px; font-size: 12px; color: #f1f5f9; border: 1px solid rgba(255,255,255,0.15); display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
    .app-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; text-align: center; }
    .app-icon-container { display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; position: relative; }
    .app-icon { width: 60px; height: 60px; border-radius: 14px; display: flex; justify-content: center; align-items: center; font-size: 26px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); transition: transform 0.1s; }
    .app-icon:active { transform: scale(0.92); }
    .app-label { font-size: 11px; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.8); }
    .badge { position: absolute; top: -2px; right: 8px; background: #ff3b30; color: white; border-radius: 10px; font-size: 10px; padding: 2px 6px; font-weight: bold; display: none; }
    
    .ios-notification { position: absolute; top: 50px; left: 12px; right: 12px; background: rgba(30,30,30,0.95); backdrop-filter: blur(20px); border-radius: 16px; padding: 12px 14px; box-shadow: 0 10px 25px rgba(0,0,0,0.6); border: 1px solid rgba(0,255,100,0.3); z-index: 200; cursor: pointer; }

    .app-view { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #121212; z-index: 50; display: flex; flex-direction: column; }
    .app-nav-bar { height: 50px; background: #1c1c1e; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid #333; flex-shrink: 0; }
    .app-body { flex: 1; overflow-y: auto; padding: 16px; }
    
    .ios-btn { width: 100%; padding: 12px; background: #007aff; color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; margin: 8px 0; text-align: center; }
    .ios-btn:active { opacity: 0.8; }
    .ios-btn.danger { background: #ff3b30; }
    .ios-btn.success { background: #34c759; }
    .ios-btn:disabled { background: #444; color: #888; cursor: not-allowed; }

    .slot-machine-box { background: #222; border-radius: 16px; padding: 14px; border: 2px solid #444; margin: 10px 0; text-align: center; }
    .slot-reels-container { display: flex; justify-content: center; gap: 8px; margin-bottom: 12px; }
    .slot-reel { width: 70px; height: 80px; background: #000; border-radius: 10px; border: 2px solid #ffd700; display: flex; justify-content: center; align-items: center; font-size: 38px; }

    .chat-bubble { max-width: 80%; padding: 10px 14px; border-radius: 16px; margin: 6px 0; font-size: 13px; line-height: 1.4; word-break: break-all; }
    .chat-bubble.incoming { background: #262628; color: #fff; align-self: flex-start; }
    .chat-bubble.outgoing { background: #00b900; color: #fff; align-self: flex-end; }
    .chat-bubble.link-box { background: #1e3a5f; border: 1px solid #007aff; cursor: pointer; }
    .voice-msg-btn { display: inline-block; background: rgba(255,255,255,0.15); padding: 4px 10px; border-radius: 12px; cursor: pointer; margin-top: 6px; font-size: 11px; color: #00ffcc; }
  </style>
</head>
<body>

<div class="iphone-frame" id="phone-frame">
  <div class="ios-status-bar">
    <span id="current-time">18:00</span>
    <div class="dynamic-island" id="day-badge">第 1 天</div>
    <span>5G 🔋</span>
  </div>

  <div class="iphone-screen" id="phone-screen">
    <div class="home-desktop">
      <div class="news-banner" onclick="openApp('news')">
        <span id="news-ticker-text">📰 【即時新聞】理財專家警告：非法網路博弈與高利貸吸金陷阱頻傳...</span>
        <span style="font-size:11px; color:#aaa;">▶</span>
      </div>

      <div class="app-grid">
        <div class="app-icon-container" onclick="openApp('futurePay')">
          <div class="app-icon" style="background: linear-gradient(135deg, #007aff, #00c6ff);">💳</div>
          <span class="app-label">未來支付</span>
        </div>
        <div class="app-icon-container" onclick="openApp('messages')">
          <div class="app-icon" style="background: linear-gradient(135deg, #00b900, #009900);">💬</div>
          <span class="app-label">Line 訊息</span>
          <div class="badge" id="total-msg-badge">0</div>
        </div>
        <div class="app-icon-container" onclick="openApp('ig')">
          <div class="app-icon" style="background: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045);">📸</div>
          <span class="app-label">IG</span>
        </div>
        <div class="app-icon-container" id="casino-app-icon" style="display:none;" onclick="openApp('casino')">
          <div class="app-icon" style="background: linear-gradient(135deg, #ff9500, #ff3b30);">🎲</div>
          <span class="app-label">橘哥娛樂城</span>
        </div>
        <div class="app-icon-container" id="loan-app-icon" style="display:none;" onclick="openApp('loan')">
          <div class="app-icon" style="background: linear-gradient(135deg, #5856d6, #3226a0);">💰</div>
          <span class="app-label">借貸錢莊</span>
        </div>
      </div>

      <div style="background: rgba(0,0,0,0.6); border-radius: 16px; padding: 12px; border: 1px solid rgba(255,255,255,0.15); margin-top: auto;">
        <h3 id="story-title" style="margin:0 0 4px 0; color:#00ffcc; font-size:15px;">第 1 天</h3>
        <div id="day-task-status" style="font-size:11px; color:#ff9500; margin-bottom:6px; line-height:1.3;">📌 待辦事項：處理今日帳單開銷。</div>
        <button class="ios-btn success" onclick="nextDay()">結束今天，進入明天</button>
      </div>
    </div>
  </div>
</div>

<script>
  let audioCtxInstance = null;
  function playSound(type) {
    try {
      if (!audioCtxInstance) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        audioCtxInstance = new AudioCtx();
      }
      if (audioCtxInstance.state === 'suspended') audioCtxInstance.resume();
      const osc = audioCtxInstance.createOscillator();
      const gain = audioCtxInstance.createGain();
      osc.connect(gain);
      gain.connect(audioCtxInstance.destination);

      if (type === 'line') {
        osc.frequency.setValueAtTime(1046.5, audioCtxInstance.currentTime); 
        osc.frequency.setValueAtTime(1318.5, audioCtxInstance.currentTime + 0.1); 
        gain.gain.setValueAtTime(0.2, audioCtxInstance.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtxInstance.currentTime + 0.25);
        osc.start(); osc.stop(audioCtxInstance.currentTime + 0.25);
      } else if (type === 'win' || type === 'success') {
        osc.frequency.setValueAtTime(523.25, audioCtxInstance.currentTime);
        osc.frequency.setValueAtTime(659.25, audioCtxInstance.currentTime + 0.1);
        gain.gain.setValueAtTime(0.2, audioCtxInstance.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtxInstance.currentTime + 0.3);
        osc.start(); osc.stop(audioCtxInstance.currentTime + 0.3);
      } else {
        osc.frequency.setValueAtTime(180, audioCtxInstance.currentTime);
        gain.gain.setValueAtTime(0.2, audioCtxInstance.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtxInstance.currentTime + 0.2);
        osc.start(); osc.stop(audioCtxInstance.currentTime + 0.2);
      }
    } catch(e) {}
  }

  function playVoice(text) {
    playSound('line');
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      let utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'zh-TW';
      window.speechSynthesis.speak(utter);
    }
  }

  const dailyConfig = {
    1: { bill: { name: "家庭伙食與日常用品費", amount: 3000 }, wife: "老公，今天晚餐做了你愛吃的糖醋排骨，快回來吃喔！", child: "爸爸今天下班會買科學麵給我嗎？" },
    2: { bill: { name: "水電與瓦斯基本費", amount: 2500 }, wife: "老公，阿偉好像一直傳訊息給你，你們最近在聊什麼投資啊？感覺怪怪的。", child: "爸爸，學校老師說要繳班費 500 元喔！" },
    3: { bill: { name: "小孩幼兒園才藝班學費", amount: 8000 }, wife: "才藝班學費帳單來了，這幾天開銷好大，你薪水夠用嗎？", child: "爸爸陪我玩積木！" },
    4: { bill: { name: "本月房屋租金與水電費", amount: 20000 }, wife: "房東剛剛狂打電話催房租 2 萬了！你帳戶到底還有沒有錢啊？", child: "爸爸肚子餓..." },
    5: { bill: { name: "機車定期保養與油錢", amount: 2000 }, wife: "老公，我看你最近一直滑手機按那個娛樂城，拜託你穩一點，別走歪路。", child: "爸爸今天可以帶我去公園溜滑梯嗎？" },
    6: { bill: { name: "父母親慢性病藥品與保健費", amount: 6000 }, wife: "媽的慢性病藥吃完了，拿藥要 6 千塊，你等等轉給我。", child: "爸爸，我的色鉛筆用完了啦。" },
    7: { bill: { name: "全家生活雜貨與採買", amount: 4500 }, wife: "冰箱空了，我帶小孩去全聯買菜，花了一點錢，你下班順便洗碗喔。", child: "爸爸我今天考試拿 100 分喔！" },
    8: { bill: { name: "全家醫療與機車強制險", amount: 5000 }, wife: "保險費扣款日到了，戶頭差點餘額不足，你皮繃緊一點。", child: "爸爸我想喝麥香奶茶～" },
    9: { bill: { name: "瓦斯與網路費", amount: 1800 }, wife: "網路費帳單寄來了，你記得繳。這幾天看你神情恍惚，是不是發生什麼事？", child: "爸爸你今天好安靜喔..." },
    10: { bill: { name: "房屋貸款分期利息", amount: 15000 }, wife: "老公！討債的人...黑衣人怎麼會突然跑到我們家裡來撒冥紙恐嚇要錢！天啊...他們剛剛竟然直接把小朋友帶走了！你到底惹到誰了？！", child: "爸爸救我...（哭喊聲）" },
    11: { bill: { name: "小孩學雜費與應急開銷", amount: 12000 }, wife: "（孩子在他們手上，快救救小孩...）", child: "（不在身邊）" },
    12: { bill: { name: "汽車維修與燃料稅", amount: 8000 }, wife: "（已讀不回）", child: "（不在身邊）" },
    13: { bill: { name: "醫療與急難預備金", amount: 10000 }, wife: "（已讀不回）", child: "（不在身邊）" },
    14: { bill: { name: "債務利息分期", amount: 15000 }, wife: "（已讀不回）", child: "（不在身邊）" },
    15: { bill: { name: "最終債務結算", amount: 50000 }, wife: "（已讀不回）", child: "（不在身邊）" }
  };

  let state = {
    day: 1,
    maxDays: 15,
    cash: 35000,
    currentBill: { name: "家庭伙食與日常用品費", amount: 3000, paid: false },
    loans: [],
    borrowedPlatforms: [],
    casinoInstalled: false,
    loanInstalled: false,
    spinsToday: 0,
    loanVisitCount: 0, // 紀錄開啟借貸 APP 的次數，用來遞增利率
    contacts: {
      wife: { name: "老婆", avatar: "👩", unread: 1, messages: [{ sender: "wife", text: "老公，今天發薪水辛苦啦！晚上煮了你愛吃的紅燒肉，記得早點回家喔 ❤️" }] },
      child: { name: "小孩", avatar: "👦", unread: 1, messages: [{ sender: "child", text: "爸爸！我今天考了 95 分喔！可以帶一杯奶茶給我嗎？" }] },
      friend: { name: "好友阿偉", avatar: "🧔", unread: 0, messages: [{ sender: "friend", text: "兄弟，最近過得怎樣？有空出來喝一杯啊！" }] }
    }
  };

  function updateUI() {
    document.getElementById("day-badge").innerText = "第 " + state.day + " 天";
    document.getElementById("story-title").innerText = "第 " + state.day + " 天";

    let totalUnread = 0;
    for (let k in state.contacts) { totalUnread += state.contacts[k].unread; }
    let badgeEl = document.getElementById("total-msg-badge");
    if (totalUnread > 0) {
      badgeEl.innerText = totalUnread;
      badgeEl.style.display = "block";
    } else {
      badgeEl.style.display = "none";
    }

    let taskEl = document.getElementById("day-task-status");
    let billStatus = state.currentBill.paid ? "✅ 今日帳單已繳納" : "⏳ 待繳: " + state.currentBill.name + " (NT$ " + state.currentBill.amount.toLocaleString() + ")";
    let loanClearStatus = state.loans.length === 0 ? "✅ 無高利貸負債" : "⚠️ 尚有高利貸未清償 (" + state.loans.length + "筆)";

    if (state.day === 1 || !state.casinoInstalled) {
      taskEl.innerText = "📌 待辦事項：處理今日帳單開銷。| " + loanClearStatus;
    } else {
      let spinsLeft = Math.max(0, 10 - state.spinsToday);
      taskEl.innerText = "📌 輪盤已打" + state.spinsToday + "次(剩" + spinsLeft + "次) | " + billStatus + " | " + loanClearStatus;
    }
  }

  function triggerNotification(senderName, text, contactKey) {
    playSound('line');
    let screen = document.getElementById("phone-screen");
    let notif = document.createElement("div");
    notif.className = "ios-notification";
    notif.innerHTML = '<div style="font-size:11px; color:#00b900; margin-bottom:2px;">Line 訊息</div>' +
                      '<div style="font-weight:bold; font-size:13px;">' + senderName + '</div>' +
                      '<div style="font-size:12px; color:#ddd;">' + text + '</div>';
    notif.onclick = function() {
      notif.remove();
      openChat(contactKey);
    };
    screen.appendChild(notif);
    setTimeout(function() { if (notif.parentNode) notif.remove(); }, 4000);
  }

  function openApp(appId) {
    let screen = document.getElementById("phone-screen");
    let existing = document.getElementById("active-app-view");
    if (existing) existing.remove();

    let view = document.createElement("div");
    view.id = "active-app-view";
    view.className = "app-view";

    let navBar = document.createElement("div");
    navBar.className = "app-nav-bar";
    navBar.innerHTML = '<span style="font-weight:600; font-size:15px;">' + getAppTitle(appId) + '</span>' +
                       '<span style="color:#00b900; cursor:pointer; font-weight:600;" onclick="closeApp()">關閉</span>';
    view.appendChild(navBar);

    let body = document.createElement("div");
    body.className = "app-body";
    view.appendChild(body);

    if (appId === 'futurePay') {
      let cashColor = state.cash < 0 ? '#ff3b30' : '#34c759';
      body.innerHTML = '<div style="background:#1c1c1e; padding:14px; border-radius:14px; margin-bottom:10px;">' +
                       '<div style="font-size:11px; color:#aaa;">未來支付 - 當前可用現金餘額</div>' +
                       '<div style="font-size:24px; font-weight:bold; color:' + cashColor + ';">NT$ ' + state.cash.toLocaleString() + '</div></div>';

      if (state.loans.length > 0) {
        let loanBox = document.createElement("div");
        loanBox.style.cssText = "background:#1c1c1e; padding:14px; border-radius:14px; margin-bottom:10px; border:1px solid #ff3b30;";
        loanBox.innerHTML = '<div style="font-size:13px; font-weight:bold; color:#ff3b30; margin-bottom:8px;">⚠️ 昨天（或之前）借的高利貸欠款（必須全數還清才能進入明天）</div>';
        
        state.loans.forEach((l, idx) => {
          let item = document.createElement("div");
          item.style.cssText = "display:flex; justify-content:space-between; align-items:center; padding:6px 0; border-bottom:1px solid #333;";
          item.innerHTML = '<div><div style="font-size:12px; font-weight:bold;">' + l.name + '</div><div style="font-size:10px; color:#ff9500;">本利和應還: NT$ ' + l.amount.toLocaleString() + '</div></div>';
          
          let btn = document.createElement("button");
          btn.className = "ios-btn success";
          btn.style.cssText = "width:auto; padding:6px 12px; font-size:11px; margin:0;";
          btn.innerText = "還款";
          btn.onclick = function() { repayLoan(idx); };
          item.appendChild(btn);
          loanBox.appendChild(item);
        });
        body.appendChild(loanBox);
      }

      let billBox = document.createElement("div");
      billBox.style.cssText = "background:#1c1c1e; padding:14px; border-radius:14px;";
      if (!state.currentBill.paid) {
        billBox.innerHTML = '<div style="font-size:13px; font-weight:bold; margin-bottom:6px;">💳 今日必須繳納項目</div>' +
                            '<div style="font-size:12px;">' + state.currentBill.name + ' (NT$ ' + state.currentBill.amount.toLocaleString() + ')</div>';
        let payBtn = document.createElement("button");
        payBtn.className = "ios-btn danger";
        payBtn.innerText = "手動繳納";
        payBtn.onclick = payBill;
        billBox.appendChild(payBtn);
      } else {
        billBox.innerHTML = '<div style="font-size:12px; color:#34c759;">✅ 今日生活開銷與帳單已全數繳清！</div>';
      }
      body.appendChild(billBox);

    } else if (appId === 'messages') {
      for (let key in state.contacts) {
        let c = state.contacts[key];
        let chatItem = document.createElement("div");
        chatItem.style.cssText = "background:#2c2c2e; padding:12px; border-radius:12px; display:flex; align-items:center; gap:12px; margin-bottom:8px; cursor:pointer;";
        chatItem.innerHTML = '<div style="font-size:24px; background:#3a3a3c; width:40px; height:40px; border-radius:50%; display:flex; justify-content:center; align-items:center;">' + c.avatar + '</div>' +
                             '<div style="flex:1;">' +
                             '<div style="font-weight:600; font-size:14px;">' + c.name + (c.unread > 0 ? ' <span style="background:#00b900; font-size:10px; padding:1px 6px; border-radius:8px;">未讀</span>' : '') + '</div>' +
                             '<div style="font-size:12px; color:#aaa;">' + c.messages[c.messages.length - 1].text + '</div></div>';
        chatItem.onclick = (k => () => openChat(k))(key);
        body.appendChild(chatItem);
      }

    } else if (appId === 'casino') {
      let canHighStake = state.day >= 4;
      let allInUnlocked = state.day >= 8;

      body.innerHTML = '<div style="text-align:center;">' +
                       '<h2 style="color:#ff9500; margin-top:0;">🎲 橘哥娛樂城</h2>' +
                       '<p style="font-size:12px; color:#aaa;">即時餘額：<b id="casino-live-cash" style="color:#34c759;">NT$ ' + state.cash.toLocaleString() + '</b></p>' +
                       '<div class="slot-machine-box">' +
                       '<div class="slot-reels-container">' +
                       '<div class="slot-reel" id="reel-1">🎰</div>' +
                       '<div class="slot-reel" id="reel-2">🎰</div>' +
                       '<div class="slot-reel" id="reel-3">🎰</div>' +
                       '</div><div id="gamble-res" style="font-weight:bold; font-size:13px; min-height:18px; color:#ff9500;"></div></div>';

      let btnGroup = document.createElement("div");
      btnGroup.style.cssText = "display:grid; grid-template-columns: repeat(2, 1fr); gap:6px; margin-bottom:8px;";
      
      [1000, 5000].forEach(amt => {
        let b = document.createElement("button");
        b.className = "ios-btn";
        b.style.cssText = "margin:0; padding:10px; font-size:13px;";
        b.innerText = "下注 " + amt.toLocaleString();
        b.onclick = () => playSlotAnimation(amt);
        btnGroup.appendChild(b);
      });

      if (canHighStake) {
        [10000, 50000].forEach(amt => {
          let b = document.createElement("button");
          b.className = "ios-btn";
          b.style.cssText = "margin:0; padding:10px; font-size:13px;";
          b.innerText = "下注 " + amt.toLocaleString();
          b.onclick = () => playSlotAnimation(amt);
          btnGroup.appendChild(b);
        });
      }
      body.appendChild(btnGroup);

      if (allInUnlocked) {
        let allInBtn = document.createElement("button");
        allInBtn.className = "ios-btn danger";
        allInBtn.innerText = "🔥 梭哈 (All-in)";
        allInBtn.onclick = () => playSlotAnimation(state.cash);
        body.appendChild(allInBtn);
      }

    } else if (appId === 'loan') {
      // 每次開啟借貸 APP，利率逐步遞增：第1次 20%，第2次 40%，第3次 50%，第4次 60%...
      let rates = [0.20, 0.40, 0.50, 0.60, 0.80, 1.00];
      let currentRate = rates[Math.min(state.loanVisitCount, rates.length - 1)];

      let baseAmount = 30000 + (state.day * 10000);
      let platforms = [
        { name: "橘速貸", amount: baseAmount, rate: currentRate },
        { name: "黑貓錢莊", amount: baseAmount + 10000, rate: currentRate },
        { name: "速速發借款", amount: baseAmount + 20000, rate: currentRate }
      ];

      let infoBox = document.createElement("div");
      infoBox.style.cssText = "font-size:11px; color:#ff9500; margin-bottom:10px; background:rgba(255,149,0,0.1); padding:8px; border-radius:8px;";
      infoBox.innerHTML = "💡 當前借貸利率：<b>" + Math.round(currentRate * 100) + "%</b>（提示：隔天開啟時利率會再調升）。今天借款**不用今天還**，隔天才需清償！";
      body.appendChild(infoBox);

      platforms.forEach(p => {
        let isBorrowed = state.borrowedPlatforms.includes(p.name);
        let pDiv = document.createElement("div");
        pDiv.style.cssText = "background:#2c2c2e; padding:10px; border-radius:10px; margin-bottom:8px; opacity:" + (isBorrowed ? 0.5 : 1) + ";";
        pDiv.innerHTML = '<b>' + p.name + ' (利率 ' + Math.round(p.rate * 100) + '%)</b>' +
                         '<div style="font-size:10px; color:#aaa;">可貸 NT$ ' + p.amount.toLocaleString() + '</div>';
        
        let loanBtn = document.createElement("button");
        loanBtn.className = isBorrowed ? "ios-btn" : "ios-btn success";
        loanBtn.style.cssText = "padding:6px; font-size:12px; margin-top:6px;";
        loanBtn.innerText = isBorrowed ? "已借過" : "立即申貸";
        loanBtn.disabled = isBorrowed;
        loanBtn.onclick = () => requestLoan(p.name, p.amount, p.rate);
        pDiv.appendChild(loanBtn);
        body.appendChild(pDiv);
      });

    } else if (appId === 'ig') {
      body.innerHTML = '<div style="background:#1a1a1a; padding:12px; border-radius:12px;">' +
                       '<b>👑 官方社群 @boss_orange</b>' +
                       '<div style="font-size:32px; text-align:center; margin:16px 0;">🏎️💸</div>' +
                       '<p style="font-size:11px; color:#ddd;">跟著橘哥團隊買，不到三天把車貸房貸全清光！想翻身立刻私訊我！</p></div>';
    }

    screen.appendChild(view);
  }

  function getAppTitle(id) {
    let map = { futurePay: '💳 未來支付', messages: '💬 Line 訊息', ig: '📸 Instagram', casino: '🎲 橘哥娛樂城', loan: '💰 借貸錢莊' };
    return map[id] || 'App';
  }

  function closeApp() {
    let v = document.getElementById("active-app-view");
    if (v) v.remove();
  }

  function openChat(contactKey) {
    let c = state.contacts[contactKey];
    c.unread = 0;
    updateUI();

    let screen = document.getElementById("phone-screen");
    let view = document.createElement("div");
    view.className = "app-view";

    let navBar = document.createElement("div");
    navBar.className = "app-nav-bar";
    navBar.innerHTML = '<span style="font-weight:600;">' + c.avatar + ' ' + c.name + '</span>' +
                       '<span style="color:#00b900; cursor:pointer;" onclick="this.closest(\'.app-view\').remove()">返回</span>';
    view.appendChild(navBar);

    let body = document.createElement("div");
    body.className = "app-body";
    body.style.cssText = "display:flex; flex-direction:column; gap:8px;";

    c.messages.forEach(m => {
      let b = document.createElement("div");
      b.className = "chat-bubble " + (m.sender === 'user' ? 'outgoing' : 'incoming');
      b.innerHTML = '<div>' + m.text + '</div>';

      let voiceBtn = document.createElement("div");
      voiceBtn.className = "voice-msg-btn";
      voiceBtn.innerText = "▶ 播放語音";
      voiceBtn.onclick = () => playVoice(m.text);
      b.appendChild(voiceBtn);

      if (m.isCasinoLink) {
        b.className += " link-box";
        b.onclick = installCasino;
      }
      if (m.isLoanLink) {
        b.className += " link-box";
        b.onclick = installLoan;
      }
      body.appendChild(b);
    });

    view.appendChild(body);
    screen.appendChild(view);
  }

  function payBill() {
    if (state.cash < state.currentBill.amount) {
      playSound('lose');
      alert("❌ 餘額不足！無法支付 " + state.currentBill.name);
      return;
    }
    state.cash -= state.currentBill.amount;
    state.currentBill.paid = true;
    playSound('success');
    alert("🎉 支付成功！");
    closeApp();
    openApp('futurePay');
    updateUI();
  }

  function repayLoan(idx) {
    let l = state.loans[idx];
    if (state.cash < l.amount) {
      playSound('lose');
      alert("❌ 現金不足以償還此筆高利貸！");
      return;
    }
    state.cash -= l.amount;
    state.loans.splice(idx, 1);
    playSound('success');
    alert("✅ 成功還清 " + l.name);
    closeApp();
    openApp('futurePay');
    updateUI();
  }

  function installCasino() {
    if (state.casinoInstalled) return;
    alert("📲 「橘哥娛樂城 App」安裝完成！");
    state.casinoInstalled = true;
    document.getElementById("casino-app-icon").style.display = "flex";
    closeApp();
    updateUI();
  }

  function installLoan() {
    if (state.loanInstalled) return;
    // 每次解鎖借貸 APP 時增加訪問次數，讓利率從 20% 開始遞增
    state.loanVisitCount++;
    alert("📲 「借貸錢莊 App」安裝完成！");
    state.loanInstalled = true;
    document.getElementById("loan-app-icon").style.display = "flex";
    closeApp();
    updateUI();
  }

  function playSlotAnimation(amount) {
    if (state.cash < amount) {
      alert("現金不足！");
      return;
    }

    let resEl = document.getElementById("gamble-res");
    resEl.innerText = "旋轉中...";
    playSound('line');

    setTimeout(() => {
      let winProb = 0.7;
      if (amount >= 50000) winProb = 0.15;
      let isWin = Math.random() < winProb;

      if (isWin) {
        document.getElementById("reel-1").innerText = "7️⃣";
        document.getElementById("reel-2").innerText = "7️⃣";
        document.getElementById("reel-3").innerText = "7️⃣";
        let win = Math.floor(amount * 1.5);
        state.cash += win;
        resEl.style.color = "#34c759";
        resEl.innerText = "🎉 贏得 NT$ " + win.toLocaleString();
        playSound('win');
      } else {
        document.getElementById("reel-1").innerText = "🍒";
        document.getElementById("reel-2").innerText = "💎";
        document.getElementById("reel-3").innerText = "7️⃣";
        state.cash -= amount;
        resEl.style.color = "#ff3b30";
        resEl.innerText = "😢 損失 NT$ " + amount.toLocaleString();
        playSound('lose');
      }

      state.spinsToday++;
      let liveCash = document.getElementById("casino-live-cash");
      if (liveCash) liveCash.innerText = "NT$ " + state.cash.toLocaleString();
      updateUI();

      if (state.cash < 10000 && !state.loanInstalled && state.casinoInstalled) {
        setTimeout(() => {
          state.contacts.friend.unread++;
          state.contacts.friend.messages.push({
            sender: "friend",
            text: "兄弟，看你快沒錢了？快用這個『借貸錢莊 App』借錢翻盤！",
            isLoanLink: true
          });
          triggerNotification("好友阿偉", "快用這個『借貸錢莊 App』借錢翻盤！", "friend");
          updateUI();
        }, 500);
      }
    }, 1000);
  }

  function requestLoan(name, amount, rate) {
    if (state.borrowedPlatforms.includes(name)) return;
    let totalRepay = Math.floor(amount * (1 + rate));
    alert("✅ 審核通過！已撥款 NT$ " + amount.toLocaleString() + "。\n💡 提醒：今天借款不需要今天還，本利和共 NT$ " + totalRepay.toLocaleString() + " 將於【明天】到期需在未來支付還款！");
    
    state.loans.push({ name: name, amount: totalRepay });
    state.borrowedPlatforms.push(name);
    state.cash += amount;

    let colKey = "col_" + Date.now();
    state.contacts[colKey] = {
      name: name + " 催收",
      avatar: "⚠️",
      unread: 1,
      messages: [{ sender: colKey, text: "本利和 NT$ " + totalRepay.toLocaleString() + "，明天到期必須清償！" }]
    };
    triggerNotification(name + " 催收", "本利和 NT$ " + totalRepay.toLocaleString() + " 須於明天清償！", colKey);
    closeApp();
    updateUI();
  }

  function nextDay() {
    if (state.casinoInstalled && state.spinsToday < 10) {
      alert("【任務未完成】轉輪盤尚未達到 10 次！");
      return;
    }
    if (!state.currentBill.paid) {
      alert("【財務未完成】今天必須在「未來支付」繳納帳單！");
      return;
    }
    if (state.loans.length > 0) {
      alert("【強制還款警告】身上仍有未清償的高利貸，必須先在「未來支付」還款完畢！");
      return;
    }

    state.day++;
    state.spinsToday = 0;
    // 進入新的一天時，借貸平台利率訪問次數+1，讓隔天的利率往上提升（20% -> 40% -> 50%...）
    state.loanVisitCount++;
    // 清空當天已借平台的限制，隔天可以再次借款
    state.borrowedPlatforms = [];

    if (state.day === 10) {
      state.contacts.wife.unread++;
      state.contacts.wife.messages.push({ sender: "wife", text: "老公！黑衣人跑到我們家裡來，把小朋友帶走了！你到底惹到誰了！" });
      triggerNotification("老婆", "黑衣人把小朋友帶走了！", "wife");
    }

    if (dailyConfig[state.day]) {
      state.currentBill = { name: dailyConfig[state.day].bill.name, amount: dailyConfig[state.day].bill.amount, paid: false };
      if (dailyConfig[state.day].wife && state.day !== 10) {
        state.contacts.wife.unread++;
        state.contacts.wife.messages.push({ sender: "wife", text: dailyConfig[state.day].wife });
        triggerNotification("老婆", dailyConfig[state.day].wife, "wife");
      }
    } else {
      state.currentBill = { name: "日常雜費與利息分期", amount: 7000, paid: false };
    }

    if (state.day === 2) {
      state.contacts.friend.unread++;
      state.contacts.friend.messages.push({
        sender: "friend",
        text: "欸兄弟！我最近在『橘哥娛樂城』爽賺翻了！點我下載！",
        isCasinoLink: true
      });
      triggerNotification("好友阿偉", "我在『橘哥娛樂城』爽賺翻了！", "friend");
    }

    if (state.day > state.maxDays) {
      alert("【悲劇結局：家破人亡】\n\n因沉迷賭博與高利貸，你輸光一切，妻離子散。警語：回頭是岸，遠離賭博。");
      location.reload();
      return;
    }

    updateUI();
    alert("☀️ 進入第 " + state.day + " 天");
  }

  updateUI();
</script>

</body>
</html>
